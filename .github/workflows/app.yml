name: App React · compilación

# Verifica que la variante React (src/) compila en cada cambio.
# Vercel publica solo public/ (demo estático); este job evita que un
# error de sintaxis en src/ llegue sin detectarse.

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
