name: Escritorio · instaladores

# Genera los instaladores de la app de escritorio (Electron).
# • Manual: pestaña Actions → «Escritorio · instaladores» → Run workflow (elige la rama).
# • Automático: al subir una etiqueta v* (ej. v1.0.0) compila Y publica un Release.
# Artefactos siempre disponibles para descargar en el run; Release solo con etiqueta.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.so }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: Windows
            os: windows-latest
            artefacto: reto-saber-windows
          - so: macOS
            os: macos-latest
            artefacto: reto-saber-macos
          - so: Linux
            os: ubuntu-latest
            artefacto: reto-saber-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Instalar dependencias (Electron + electron-builder)
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Sincronizar el demo canónico
        working-directory: desktop
        run: npm run sincronizar

      - name: Compilar instaladores
        working-directory: desktop
        run: npx electron-builder --publish never

      - name: Subir instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los tres instaladores
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: instaladores

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
          draft: false
          prerelease: false
