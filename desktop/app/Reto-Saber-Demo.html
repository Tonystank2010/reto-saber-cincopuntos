/* ---- v34: diseno ed-tech moderno ----

:root{
  --ac2:#7c3aed;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
  --gradS:linear-gradient(135deg,#4f46e5 0%,#8b5cf6 100%);
  --shC:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.07);
  --shA:0 2px 8px rgba(79,70,229,.35);
  --r2:20px;
}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---- tarjetas: profundidad sutil ---- */
.card{border-radius:var(--r2);box-shadow:var(--shC);border-color:rgba(79,70,229,.12)}
.card>.mu~.mu{margin-top:.4em}

/* ---- botones primarios: gradiente indice→violeta ---- */
main .card>button:not(.opt):not(.chip):not(.dot):not(.g),
main .card .row>button:not(.chip):not(.opt):not(.dot):not(.g){
  background:var(--grad);box-shadow:var(--shA);border:none;transition:filter .15s ease,transform .15s ease}
main .card>button:not(.opt):not(.chip):not(.dot):not(.g):hover,
main .card .row>button:not(.chip):not(.opt):not(.dot):not(.g):hover{filter:brightness(1.07)}
main .card>button:not(.opt):not(.chip):not(.dot):not(.g):active,
main .card .row>button:not(.chip):not(.opt):not(.dot):not(.g):active{transform:scale(.985)}

/* ---- opciones de pregunta: tarjetas táctiles ---- */
.opt{border-radius:14px;padding:12px 14px;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
.opt:hover{border-color:var(--ac)}
.opt.sel{border-color:var(--ac);box-shadow:0 0 0 3px rgba(79,70,229,.18)}
.opt.ok{box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.opt.no{box-shadow:0 0 0 3px rgba(220,38,38,.14)}
.opt:active{transform:scale(.99)}

/* ---- retroalimentación ---- */
.fb{border-radius:14px;border-left:4px solid transparent}
.fb.ok{border-left-color:var(--ok)}
.fb.no{border-left-color:var(--no)}

/* ---- camino: nodos con vida ---- */
.dot{transition:transform .18s ease,box-shadow .18s ease}
.dot:not(.lk):hover{transform:scale(1.05)}
.bar i{background:var(--grad)}

/* ---- chips activos: tinte suave ---- */
.chip.on{background:rgba(79,70,229,.12);font-weight:700}

/* ---- barra inferior flotante ---- */
nav{box-shadow:0 -4px 16px rgba(15,23,42,.08)}

/* ---- títulos de pantalla ---- */
.top b{font-size:20px;letter-spacing:-.01em}

/* ---- MODO OSCURO (mismo mecanismo del demo: data-th / prefers-color-scheme) ---- */
:root[data-th=dark]{

  :root:not([data-th=light]) .chip.on{background:rgba(129,140,248,.16)}

}

-03","examen":"Saber 11","area":"Matemáticas","nivel":"Básico","competencia":"Interpretación y representación","enunciado":"En una caminata, Lina recorrió 3,2 km por la mañana y 1,8 km por la tarde. ¿Qué distancia recorrió en total?","opciones":[{"id":"A","texto":"4 km"},{"id":"B","texto":"4,8 km"},{"id":"C","texto":"5 km"},{"id":"D","texto":"5,2 km"}],"respuesta":"C","explicacion":"Al sumar las distancias, 3,2 + 1,8 = 5,0 kilómetros.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-04","examen":"Saber 11","area":"Matemáticas","nivel":"Intermedio","competencia":"Argumentación","enunciado":"Un grupo registró cuántos libros leyó cada integrante en un mes: 2, 3, 3, 4 y 8. ¿Cuál es la mediana?","opciones":[{"id":"A","texto":"2"},{"id":"B","texto":"3"},{"id":"C","texto":"4"},{"id":"D","texto":"8"}],"respuesta":"B","explicacion":"Los datos ya están ordenados y el valor central de los cinco es 3.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-01","examen":"Saber 11","area":"Lectura Crítica","nivel":"Básico","competencia":"Comprensión local","enunciado":"Lee: «El club escolar abrió los miércoles para que quienes no pueden asistir los viernes también tengan un espacio de lectura». Según el texto, ¿por qué abrió el miércoles?","opciones":[{"id":"A","texto":"Para reemplazar todos los clubes escolares."},{"id":"B","texto":"Para ofrecer otra oportunidad a quienes no pueden ir el viernes."},{"id":"C","texto":"Para preparar una competencia de lectura."},{"id":"D","texto":"Para reducir la cantidad de libros disponibles."}],"respuesta":"B","explicacion":"El texto indica que el nuevo horario busca incluir a quienes no pueden asistir el viernes.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-02","examen":"Saber 11","area":"Lectura Crítica","nivel":"Básico","competencia":"Comprensión global","enunciado":"Un aviso dice: «Trae tu propia botella; el punto de agua del parque estará habilitado durante toda la jornada». ¿Cuál es el propósito principal del aviso?","opciones":[{"id":"A","texto":"Invitar a las personas a usar el punto de agua llevando una botella."},{"id":"B","texto":"Informar que el parque estará cerrado."},{"id":"C","texto":"Pedir que se vendan botellas en el parque."},{"id":"D","texto":"Anunciar una competencia deportiva."}],"respuesta":"A","explicacion":"El aviso comunica que habrá agua disponible e invita a llevar una botella reutilizable.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-03","examen":"Saber 11","area":"Lectura Crítica","nivel":"Intermedio","competencia":"Reflexión y evaluación","enunciado":"Una columna afirma que los jardines del barrio reducen el calor y luego describe cómo tres calles con árboles tienen más sombra al mediodía. ¿Qué función cumple el ejemplo de las calles?","opciones":[{"id":"A","texto":"Presentar un caso que apoya la afirmación."},{"id":"B","texto":"Cambiar el tema hacia el transporte."},{"id":"C","texto":"Negar que los árboles produzcan sombra."},{"id":"D","texto":"Dar una instrucción para plantar árboles."}],"respuesta":"A","explicacion":"El caso de las calles ilustra la relación entre árboles y sombra que sostiene la columna.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-04","examen":"Saber 11","area":"Lectura Crítica","nivel":"Básico","competencia":"Comprensión local","enunciado":"Lee: «Aunque el cielo estaba nublado, el equipo decidió iniciar la observación de aves y llevó impermeables por precaución». ¿Qué hizo el equipo?","opciones":[{"id":"A","texto":"Canceló la observación por completo."},{"id":"B","texto":"Comenzó la actividad y se preparó para la lluvia."},{"id":"C","texto":"Esperó a que el cielo estuviera despejado."},{"id":"D","texto":"Dejó los impermeables en casa."}],"respuesta":"B","explicacion":"El equipo inició la observación y llevó impermeables como medida preventiva.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-01","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Básico","competencia":"Indagación","enunciado":"Un grupo quiere comparar cuánto tarda en derretirse un cubo de hielo sobre metal y sobre madera. ¿Qué condición debe mantener igual para que la comparación sea más justa?","opciones":[{"id":"A","texto":"El tamaño inicial de los cubos y el lugar de observación."},{"id":"B","texto":"El material de las dos superficies."},{"id":"C","texto":"El tiempo que tarda cada cubo en derretirse."},{"id":"D","texto":"El resultado que espera obtener el grupo."}],"respuesta":"A","explicacion":"Al mantener iguales el tamaño y el entorno, el material de la superficie es la diferencia principal.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-02","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Básico","competencia":"Uso comprensivo del conocimiento científico","enunciado":"En un terrario cerrado, las plantas reciben luz y agua. ¿Qué proceso permite que produzcan azúcares usando energía luminosa?","opciones":[{"id":"A","texto":"La evaporación"},{"id":"B","texto":"La fotosíntesis"},{"id":"C","texto":"La condensación"},{"id":"D","texto":"La erosión"}],"respuesta":"B","explicacion":"En la fotosíntesis las plantas usan energía de la luz para producir azúcares a partir de agua y dióxido de carbono.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-03","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Básico","competencia":"Explicación de fenómenos","enunciado":"Al poner una cuchara fría dentro de una bebida tibia, la cuchara se calienta y la bebida se enfría un poco. ¿Cómo se transfiere principalmente la energía entre ambos?","opciones":[{"id":"A","texto":"Del objeto más frío al más caliente de forma espontánea."},{"id":"B","texto":"De la bebida más caliente hacia la cuchara más fría."},{"id":"C","texto":"Solo por la producción de luz."},{"id":"D","texto":"No hay transferencia de energía."}],"respuesta":"B","explicacion":"La energía térmica fluye del cuerpo con mayor temperatura al de menor temperatura.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-04","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Intermedio","competencia":"Indagación","enunciado":"Para investigar si la cantidad de luz afecta el crecimiento de una planta, ¿qué dato sería más útil registrar cada semana?","opciones":[{"id":"A","texto":"La altura de cada planta y las horas de luz recibidas."},{"id":"B","texto":"El color favorito de quien cuida la planta."},{"id":"C","texto":"La marca del cuaderno donde se anotan los datos."},{"id":"D","texto":"La cantidad de macetas en otras casas."}],"respuesta":"A","explicacion":"La altura mide crecimiento y las horas de luz permiten comparar la condición que se estudia.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-01","examen":"Saber 11","area":"Sociales y Ciudadanas","nivel":"Básico","competencia":"Pensamiento social","enunciado":"En una comunidad, varias personas proponen usar el salón comunal para actividades distintas. ¿Qué mecanismo permite escuchar propuestas y acordar un uso compartido?","opciones":[{"id":"A","texto":"Una reunión abierta con turnos de palabra y votación."},{"id":"B","texto":"Cerrar el salón sin explicar el motivo."},{"id":"C","texto":"Permitir que decida quien llegue primero."},{"id":"D","texto":"Cancelar todas las actividades futuras."}],"respuesta":"A","explicacion":"La participación con deliberación y una regla acordada ayuda a tomar una decisión colectiva.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-02","examen":"Saber 11","area":"Sociales y Ciudadanas","nivel":"Básico","competencia":"Interpretación y análisis de perspectivas","enunciado":"Un mercado local cambia su horario. Las personas que venden piden abrir más temprano y parte del vecindario pide reducir el ruido de madrugada. ¿Qué acción reconoce ambas perspectivas?","opciones":[{"id":"A","texto":"Ignorar a quienes viven cerca."},{"id":"B","texto":"Probar un horario acordado y revisar sus efectos con ambos grupos."},{"id":"C","texto":"Prohibir permanentemente el mercado."},{"id":"D","texto":"Suponer que todos tienen la misma necesidad."}],"respuesta":"B","explicacion":"Un acuerdo revisable permite considerar tanto la actividad económica como el bienestar vecinal.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-03","examen":"Saber 11","area":"Sociales y Ciudadanas","nivel":"Intermedio","competencia":"Pensamiento reflexivo y sistémico","enunciado":"Una ciudad amplía una cicloruta para conectar dos barrios con una biblioteca. ¿Cuál podría ser un efecto que conviene evaluar además del tiempo de viaje?","opciones":[{"id":"A","texto":"Si más personas pueden llegar a servicios y espacios públicos."},{"id":"B","texto":"El nombre de la pintura usada en los mapas."},{"id":"C","texto":"La cantidad de letras en el nombre de los barrios."},{"id":"D","texto":"El color de las bicicletas privadas."}],"respuesta":"A","explicacion":"Una conexión puede influir en el acceso a servicios, además de modificar el tiempo de desplazamiento.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-04","examen":"Saber 11","area":"Sociales y Ciudadanas","nivel":"Básico","competencia":"Pensamiento social","enunciado":"Un grupo vecinal quiere solicitar que se repare una luminaria pública. ¿Qué información hace más clara su solicitud a la entidad responsable?","opciones":[{"id":"A","texto":"La ubicación aproximada, el problema observado y la fecha."},{"id":"B","texto":"Una lista de rumores del barrio."},{"id":"C","texto":"Los datos personales de todas las familias."},{"id":"D","texto":"Una petición sin describir el asunto."}],"respuesta":"A","explicacion":"Ubicación, descripción y fecha ayudan a identificar el problema sin divulgar datos privados innecesarios.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"ing-01","examen":"Saber 11","area":"Inglés","nivel":"Básico","competencia":"Comprensión de textos cortos","enunciado":"Read the note: “The science room is closed today. Please meet your group in the library at 2 p.m.” Where should the group meet?","opciones":[{"id":"A","texto":"In the science room"},{"id":"B","texto":"In the library"},{"id":"C","texto":"At the bus station"},{"id":"D","texto":"At 3 p.m. outside"}],"respuesta":"B","explicacion":"The note says the group should meet in the library at 2 p.m.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"ing-02","examen":"Saber 11","area":"Inglés","nivel":"Básico","competencia":"Uso del lenguaje","enunciado":"Choose the best word to complete the sentence: “Marta ___ her lunch before leaving home every morning.”","opciones":[{"id":"A","texto":"pack"},{"id":"B","texto":"packs"},{"id":"C","texto":"packing"},{"id":"D","texto":"packed"}],"respuesta":"B","explicacion":"For a habitual action with “Marta” (she), the present simple verb takes -s: “packs.”","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"ing-03","examen":"Saber 11","area":"Inglés","nivel":"Básico","competencia":"Comprensión de textos cortos","enunciado":"A sign at a community garden says: “Please water the young plants, not the flowers in the blue pots.” What should visitors water?","opciones":[{"id":"A","texto":"The young plants"},{"id":"B","texto":"Only the blue pots"},{"id":"C","texto":"All the flowers"},{"id":"D","texto":"The garden path"}],"respuesta":"A","explicacion":"The sign asks visitors to water the young plants and excludes flowers in blue pots.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"ing-04","examen":"Saber 11","area":"Inglés","nivel":"Intermedio","competencia":"Uso del lenguaje","enunciado":"Complete the exchange: “Would you like some water?” “Yes, ___.”","opciones":[{"id":"A","texto":"please"},{"id":"B","texto":"yesterday"},{"id":"C","texto":"there are"},{"id":"D","texto":"never mind"}],"respuesta":"A","explicacion":"“Yes, please” is a polite and natural way to accept an offer.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-b04","examen":"Saber 11","area":"Matemáticas","nivel":"Básico","competencia":"Formulación y ejecución","enunciado":"Una biblioteca organiza 3 estantes con 8 libros cada uno y presta 5 libros. ¿Cuántos quedan en esos estantes?","opciones":[{"id":"A","texto":"19"},{"id":"B","texto":"21"},{"id":"C","texto":"24"},{"id":"D","texto":"29"}],"respuesta":"A","explicacion":"Los estantes reúnen 3 × 8 = 24 libros; al prestar 5 quedan 24 − 5 = 19.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-b05","examen":"Saber 11","area":"Matemáticas","nivel":"Básico","competencia":"Interpretación y representación","enunciado":"Una receta usa 3 tazas de avena para preparar 4 porciones. Si se duplican las porciones manteniendo la receta, ¿cuántas tazas se necesitan?","opciones":[{"id":"A","texto":"5"},{"id":"B","texto":"6"},{"id":"C","texto":"7"},{"id":"D","texto":"8"}],"respuesta":"B","explicacion":"Duplicar de 4 a 8 porciones requiere duplicar también la avena: 3 × 2 = 6 tazas.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-i02","examen":"Saber 11","area":"Matemáticas","nivel":"Intermedio","competencia":"Argumentación","enunciado":"Tres mediciones tienen promedio 14. Dos de ellas son 12 y 15. ¿Cuál es la tercera medición?","opciones":[{"id":"A","texto":"13"},{"id":"B","texto":"14"},{"id":"C","texto":"15"},{"id":"D","texto":"17"}],"respuesta":"C","explicacion":"El total debe ser 3 × 14 = 42; las dos mediciones suman 27, así que la tercera es 15.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-i03","examen":"Saber 11","area":"Matemáticas","nivel":"Intermedio","competencia":"Interpretación y representación","enunciado":"En una bolsa hay 3 fichas rojas y 2 azules. Se extrae una ficha al azar sin mirar. ¿Cuál es la probabilidad de que sea roja?","opciones":[{"id":"A","texto":"2/5"},{"id":"B","texto":"3/5"},{"id":"C","texto":"1/2"},{"id":"D","texto":"3/2"}],"respuesta":"B","explicacion":"Hay 3 resultados favorables entre 5 fichas posibles, por lo que la probabilidad es 3/5.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-i04","examen":"Saber 11","area":"Matemáticas","nivel":"Intermedio","competencia":"Formulación y ejecución","enunciado":"En un mapa, 1 cm representa 4 km. La distancia entre dos puntos mide 3,5 cm. ¿Qué distancia representa en el terreno?","opciones":[{"id":"A","texto":"7 km"},{"id":"B","texto":"12 km"},{"id":"C","texto":"14 km"},{"id":"D","texto":"16 km"}],"respuesta":"C","explicacion":"Cada centímetro representa 4 km, así que 3,5 × 4 = 14 km.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-i05","examen":"Saber 11","area":"Matemáticas","nivel":"Intermedio","competencia":"Formulación y ejecución","enunciado":"Un número se duplica y luego se le suman 5 unidades. El resultado es 17. ¿Cuál era el número?","opciones":[{"id":"A","texto":"5"},{"id":"B","texto":"6"},{"id":"C","texto":"11"},{"id":"D","texto":"22"}],"respuesta":"B","explicacion":"Si x es el número, 2x + 5 = 17; al restar 5 y dividir entre 2 se obtiene x = 6.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-a01","examen":"Saber 11","area":"Matemáticas","nivel":"Avanzado","competencia":"Formulación y ejecución","enunciado":"Un servicio de transporte cobra una tarifa fija de $2.500 y $900 por kilómetro. ¿Cuánto cuesta un recorrido de 7 km?","opciones":[{"id":"A","texto":"$6.300"},{"id":"B","texto":"$8.800"},{"id":"C","texto":"$9.000"},{"id":"D","texto":"$17.500"}],"respuesta":"B","explicacion":"El costo es 2.500 + 7 × 900 = 8.800 pesos.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-a02","examen":"Saber 11","area":"Matemáticas","nivel":"Avanzado","competencia":"Argumentación","enunciado":"Un poste de 1,5 m proyecta una sombra de 2 m. A la misma hora, un árbol proyecta una sombra de 10 m. Si el suelo es plano, ¿cuál es la altura estimada del árbol?","opciones":[{"id":"A","texto":"6 m"},{"id":"B","texto":"7,5 m"},{"id":"C","texto":"12 m"},{"id":"D","texto":"13,5 m"}],"respuesta":"B","explicacion":"Los triángulos son semejantes: altura/sombra = 1,5/2, así que la altura del árbol es 10 × 1,5/2 = 7,5 m.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-a03","examen":"Saber 11","area":"Matemáticas","nivel":"Avanzado","competencia":"Interpretación y representación","enunciado":"Cinco tiempos de recorrido, en minutos, fueron 5, 6, 7, 8 y 34. ¿Cuál medida describe mejor el tiempo central sin que el último valor lo desplace mucho?","opciones":[{"id":"A","texto":"La media, 12"},{"id":"B","texto":"La mediana, 7"},{"id":"C","texto":"El rango, 29"},{"id":"D","texto":"La suma, 60"}],"respuesta":"B","explicacion":"La mediana es el dato central al ordenar los tiempos; aquí es 7 y es menos sensible al valor extremo 34.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-a04","examen":"Saber 11","area":"Matemáticas","nivel":"Avanzado","competencia":"Formulación y ejecución","enunciado":"Una mochila cuesta $80.000 y tiene un descuento del 20 %. ¿Cuál es su precio después del descuento?","opciones":[{"id":"A","texto":"$16.000"},{"id":"B","texto":"$60.000"},{"id":"C","texto":"$64.000"},{"id":"D","texto":"$68.000"}],"respuesta":"C","explicacion":"El descuento es 0,20 × 80.000 = 16.000; el precio final es 80.000 − 16.000 = 64.000 pesos.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-a05","examen":"Saber 11","area":"Matemáticas","nivel":"Avanzado","competencia":"Interpretación y representación","enunciado":"Un tanque contiene 120 litros y pierde agua a una tasa constante de 8 litros por minuto. ¿Cuántos litros quedan después de 9 minutos?","opciones":[{"id":"A","texto":"48"},{"id":"B","texto":"72"},{"id":"C","texto":"88"},{"id":"D","texto":"112"}],"respuesta":"A","explicacion":"En 9 minutos pierde 8 × 9 = 72 litros, por lo que quedan 120 − 72 = 48 litros.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-b04","examen":"Saber 11","area":"Lectura Crítica","nivel":"Básico","competencia":"Comprensión local","enunciado":"En el aviso “El taller de cerámica se traslada al salón 3; conserva el horario de las 10”, ¿qué dato no cambia?","opciones":[{"id":"A","texto":"El salón"},{"id":"B","texto":"La actividad"},{"id":"C","texto":"La hora"},{"id":"D","texto":"El día de la semana"}],"respuesta":"C","explicacion":"El aviso indica explícitamente que se conserva el horario de las 10.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-b05","examen":"Saber 11","area":"Lectura Crítica","nivel":"Básico","competencia":"Comprensión local","enunciado":"“La lluvia llenó los baldes del patio. Mañana el grupo usará esa agua para regar las plantas”. ¿Para qué guardaron el agua?","opciones":[{"id":"A","texto":"Para lavar los baldes"},{"id":"B","texto":"Para regar las plantas"},{"id":"C","texto":"Para llenar una piscina"},{"id":"D","texto":"Para medir la lluvia"}],"respuesta":"B","explicacion":"La segunda oración señala directamente que el agua se usará para regar las plantas.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-i02","examen":"Saber 11","area":"Lectura Crítica","nivel":"Intermedio","competencia":"Comprensión global","enunciado":"Una nota escolar cuenta que el patio se cubrió con plantas nativas. Añade que, tras un mes, más insectos visitan el lugar y el suelo permanece húmedo. ¿Cuál idea resume mejor el texto?","opciones":[{"id":"A","texto":"Las plantas nativas pueden cambiar condiciones y atraer vida al patio."},{"id":"B","texto":"El patio ya no necesita mantenimiento."},{"id":"C","texto":"Los insectos son la única razón para plantar."},{"id":"D","texto":"El suelo húmedo siempre impide el crecimiento."}],"respuesta":"A","explicacion":"La nota relaciona la siembra con cambios observados en la humedad y las visitas de insectos, sin afirmar que no haga falta mantenimiento.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-i03","examen":"Saber 11","area":"Lectura Crítica","nivel":"Intermedio","competencia":"Interpretación de perspectivas","enunciado":"En una reunión, una estudiante apoya ampliar la biblioteca porque hay lista de espera. Un bibliotecario propone extender el horario antes de comprar más libros. ¿En qué coinciden?","opciones":[{"id":"A","texto":"En que el espacio no debe abrir los fines de semana"},{"id":"B","texto":"En que hay una dificultad de acceso que requiere una respuesta"},{"id":"C","texto":"En que se deben retirar libros"},{"id":"D","texto":"En que el horario actual es suficiente"}],"respuesta":"B","explicacion":"Aunque proponen medidas distintas, ambas intervenciones reconocen que algunas personas no acceden fácilmente a los recursos.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-i04","examen":"Saber 11","area":"Lectura Crítica","nivel":"Intermedio","competencia":"Evaluación de argumentos","enunciado":"Una columna afirma que caminar a la escuela reduce la congestión frente a la entrada. ¿Qué dato respaldaría de forma más directa esa afirmación?","opciones":[{"id":"A","texto":"El número de vehículos que llegan antes y después de una jornada de caminata"},{"id":"B","texto":"El color de los uniformes del colegio"},{"id":"C","texto":"La opinión de una persona que no asistió"},{"id":"D","texto":"La cantidad de salones del edificio"}],"respuesta":"A","explicacion":"Comparar el flujo de vehículos antes y después permite observar el cambio que la afirmación plantea.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-i05","examen":"Saber 11","area":"Lectura Crítica","nivel":"Intermedio","competencia":"Comprensión global","enunciado":"Un texto describe cómo una plaza se usa por la mañana para vender alimentos y por la tarde para actividades culturales. ¿Qué relación organiza principalmente la descripción?","opciones":[{"id":"A","texto":"El cambio de usos del mismo espacio durante el día"},{"id":"B","texto":"La historia de cada vendedor"},{"id":"C","texto":"Una comparación de precios"},{"id":"D","texto":"La construcción de una plaza nueva"}],"respuesta":"A","explicacion":"La información se organiza alrededor de dos usos distintos de la plaza en momentos diferentes.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-a01","examen":"Saber 11","area":"Lectura Crítica","nivel":"Avanzado","competencia":"Evaluación de argumentos","enunciado":"Un artículo sostiene que instalar bebederos en un parque aumentará las visitas. Como evidencia presenta una encuesta a diez personas que ya visitan el parque. ¿Cuál limitación es más importante?","opciones":[{"id":"A","texto":"La muestra puede no representar a quienes aún no visitan el parque."},{"id":"B","texto":"Las respuestas están escritas en papel."},{"id":"C","texto":"El parque tiene árboles."},{"id":"D","texto":"Las diez personas conocen el parque."}],"respuesta":"A","explicacion":"La conclusión se refiere a un posible aumento de visitas, pero la encuesta solo incluye a visitantes actuales y podría dejar por fuera a la población que se quiere atraer.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-a02","examen":"Saber 11","area":"Lectura Crítica","nivel":"Avanzado","competencia":"Interpretación de perspectivas","enunciado":"Una crónica relata que un barrio recuperó un lote para crear una huerta. Incluye voces de quienes cultivan, de quienes pasan por allí y de una persona que teme el ruido. ¿Qué efecto produce incluir las tres voces?","opciones":[{"id":"A","texto":"Presenta el proyecto como una experiencia con intereses diversos"},{"id":"B","texto":"Demuestra que todas las personas están de acuerdo"},{"id":"C","texto":"Prueba que la huerta genera ruido todo el día"},{"id":"D","texto":"Elimina la necesidad de describir el lugar"}],"respuesta":"A","explicacion":"Las voces muestran distintas experiencias y evitan reducir el proyecto a una sola perspectiva.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-a03","examen":"Saber 11","area":"Lectura Crítica","nivel":"Avanzado","competencia":"Evaluación de argumentos","enunciado":"Un informe afirma que apagar las luces del corredor ahorrará energía sin afectar la seguridad. ¿Qué evidencia permitiría evaluar ambas partes de la afirmación?","opciones":[{"id":"A","texto":"Mediciones de consumo y registros de visibilidad o incidentes antes y después"},{"id":"B","texto":"Una lista de colores para pintar el corredor"},{"id":"C","texto":"El número de personas que prefieren la mañana"},{"id":"D","texto":"La marca de las bombillas almacenadas"}],"respuesta":"A","explicacion":"El consumo mide el ahorro y los datos de visibilidad o incidentes ayudan a examinar la condición sobre seguridad.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-a04","examen":"Saber 11","area":"Lectura Crítica","nivel":"Avanzado","competencia":"Comprensión global","enunciado":"Un ensayo compara dos huertas: una con riego diario y otra con riego según la humedad del suelo. Concluye que observar las condiciones puede evitar desperdicios. ¿Qué supuesto sostiene esa conclusión?","opciones":[{"id":"A","texto":"Que el riego ajustado a la necesidad puede usar menos agua que un horario fijo"},{"id":"B","texto":"Que todas las plantas requieren idéntica cantidad de agua"},{"id":"C","texto":"Que medir humedad impide el crecimiento"},{"id":"D","texto":"Que las dos huertas tienen el mismo tamaño"}],"respuesta":"A","explicacion":"La recomendación depende de que ajustar el riego a la humedad reduzca aplicaciones innecesarias sin perjudicar las plantas.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-a05","examen":"Saber 11","area":"Lectura Crítica","nivel":"Avanzado","competencia":"Interpretación de recursos","enunciado":"Un cartel muestra una gráfica donde suben las solicitudes a una biblioteca durante tres meses, pero no indica cuántas personas viven en el sector. ¿Qué interpretación debe evitarse?","opciones":[{"id":"A","texto":"Que aumentaron las solicitudes registradas"},{"id":"B","texto":"Que el cambio observado ocurrió en ese periodo"},{"id":"C","texto":"Que cada habitante del sector empezó a leer más"},{"id":"D","texto":"Que la gráfica presenta tres meses"}],"respuesta":"C","explicacion":"Las solicitudes no permiten inferir el comportamiento de cada habitante, especialmente sin conocer población ni posibles cambios en usuarios.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-b04","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Básico","competencia":"Uso comprensivo del conocimiento científico","enunciado":"En un terrario, las plantas reciben luz y agua, y algunos insectos se alimentan de hojas. ¿Qué papel cumplen las plantas en esta relación?","opciones":[{"id":"A","texto":"Producen materia orgánica usando energía de la luz"},{"id":"B","texto":"Descomponen todos los minerales del suelo"},{"id":"C","texto":"Consumen únicamente a los insectos"},{"id":"D","texto":"Impiden cualquier intercambio de energía"}],"respuesta":"A","explicacion":"Las plantas captan energía lumínica y la usan para producir materia orgánica que sostiene otras relaciones alimentarias.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-b05","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Básico","competencia":"Uso comprensivo del conocimiento científico","enunciado":"Una cuchara metálica y una de madera permanecen en una habitación fresca. Al tocarlas, la metálica parece más fría. ¿Qué propiedad explica mejor esa sensación?","opciones":[{"id":"A","texto":"El metal transfiere calor desde la mano más rápidamente"},{"id":"B","texto":"La madera tiene una temperatura siempre mayor que el aire"},{"id":"C","texto":"El metal produce frío por sí mismo"},{"id":"D","texto":"La cuchara de madera no intercambia energía"}],"respuesta":"A","explicacion":"El metal conduce el calor mejor que la madera y extrae energía de la mano con mayor rapidez, aunque ambas cucharas estén a temperatura similar.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-i02","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Intermedio","competencia":"Indagación","enunciado":"Un grupo compara el crecimiento de semillas con dos cantidades de agua. ¿Qué condición debería mantener igual para atribuir con más confianza las diferencias al riego?","opciones":[{"id":"A","texto":"El tipo de semilla, la luz y el recipiente"},{"id":"B","texto":"El color de la etiqueta en cada maceta"},{"id":"C","texto":"El nombre de quien mide"},{"id":"D","texto":"La hora en que se escribe el título"}],"respuesta":"A","explicacion":"Mantener constantes otros factores relevantes permite estudiar de manera más clara el efecto de la cantidad de agua.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-i03","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Intermedio","competencia":"Explicación de fenómenos","enunciado":"Un bloque de hielo se derrite en un plato a temperatura ambiente. ¿Qué cambio ocurre principalmente durante la fusión?","opciones":[{"id":"A","texto":"El agua pasa de sólido a líquido al recibir energía"},{"id":"B","texto":"Las moléculas de agua desaparecen"},{"id":"C","texto":"El hielo se transforma en una sustancia distinta"},{"id":"D","texto":"El plato crea agua nueva"}],"respuesta":"A","explicacion":"La fusión es un cambio de estado: el agua sólida recibe energía y pasa a estado líquido sin convertirse en otra sustancia.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-i04","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Intermedio","competencia":"Uso comprensivo del conocimiento científico","enunciado":"En una cadena sencilla, algas sirven de alimento a pequeños crustáceos y estos a peces. Si disminuyen mucho las algas, ¿qué consecuencia es más directa?","opciones":[{"id":"A","texto":"Los crustáceos pueden tener menos alimento disponible"},{"id":"B","texto":"Los peces dejan de necesitar energía"},{"id":"C","texto":"Aumenta automáticamente la cantidad de algas"},{"id":"D","texto":"El agua se convierte en alimento"}],"respuesta":"A","explicacion":"Una reducción de productores puede disminuir el alimento disponible para los organismos que dependen de ellos.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-i05","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Intermedio","competencia":"Indagación","enunciado":"Para medir si un filtro casero reduce partículas visibles en agua turbia, ¿qué comparación ofrece evidencia más útil?","opciones":[{"id":"A","texto":"Observar volúmenes iguales antes y después con la misma iluminación"},{"id":"B","texto":"Probar un volumen distinto cada vez y cambiar la luz"},{"id":"C","texto":"Comparar el agua con una fotografía de otro lugar"},{"id":"D","texto":"Preguntar qué filtro parece más bonito"}],"respuesta":"A","explicacion":"Igualar volumen e iluminación mejora la comparación visual del agua antes y después del filtro.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-a01","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Avanzado","competencia":"Indagación","enunciado":"Dos grupos prueban un material para mantener fría una botella. Uno usa una capa gruesa del material y otro una capa delgada; también dejan las botellas en lugares distintos. ¿Qué mejora permitiría comparar el material?","opciones":[{"id":"A","texto":"Usar igual grosor, botellas y ubicación, cambiando solo el material"},{"id":"B","texto":"Cambiar al tiempo el material, el volumen y el lugar"},{"id":"C","texto":"Medir solo la botella que se vea más fría"},{"id":"D","texto":"Registrar la temperatura una sola vez sin anotar la hora"}],"respuesta":"A","explicacion":"Controlar grosor, recipiente y entorno permite atribuir con mayor claridad las diferencias al material aislante.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-a02","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Avanzado","competencia":"Explicación de fenómenos","enunciado":"En un circuito con una pila y dos bombillos conectados en serie, uno se desconecta. ¿Qué se espera que ocurra con el otro bombillo?","opciones":[{"id":"A","texto":"Se apaga porque se interrumpe el camino de la corriente"},{"id":"B","texto":"Brilla más porque recibe toda la luz"},{"id":"C","texto":"Sigue igual porque no comparte circuito"},{"id":"D","texto":"Se convierte en una pila"}],"respuesta":"A","explicacion":"En una conexión en serie hay un único camino; al abrirlo, la corriente deja de circular por todo el circuito.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-a03","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Avanzado","competencia":"Uso comprensivo del conocimiento científico","enunciado":"Una huerta usa fertilizante cerca de un canal. Después de lluvias fuertes aparecen muchas algas en el agua. ¿Qué explicación conecta mejor ambos hechos?","opciones":[{"id":"A","texto":"La escorrentía pudo llevar nutrientes al canal y favorecer el crecimiento de algas"},{"id":"B","texto":"Las algas produjeron la lluvia sobre la huerta"},{"id":"C","texto":"El fertilizante eliminó todos los nutrientes del agua"},{"id":"D","texto":"La lluvia convierte cualquier canal en agua salada"}],"respuesta":"A","explicacion":"El arrastre de nutrientes desde el suelo puede enriquecer el agua y favorecer un crecimiento abundante de algas.","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-a04","examen":"Saber 11","area":"Ciencias Naturales","nivel":"Avanzado","competencia":"Indagación","enunciado":"Un equipo afirma que una planta crece más por recibir sonido musical. ¿Qué diseño ayuda mejor a separar el efecto del sonido de otros factores?","opciones":[{"id":"A","texto":"Asignar plantas similares al azar a grupos con y sin sonido y controlar luz, agua y tiempo"},{"id":"B","texto":"Poner una sola planta junto a una ventana y medirla una vez"},{"id":"C","texto":"Cambiar el tipo de música, agua y luz cada día"},{"id":"D","texto":"Comparar una planta con una planta de otra especie"}],"respuesta":"A","explicacion":"Grupos comparables y condiciones controladas perm /* orden(a, semilla): mezcla determinista del espacio con banco fijo intercalado */
const orden=(a,sd)=>{
 const C=CUOTA[a],rnd=mb32(Math.floor(sd*7919)+17),re=reales(a);
 const R=Math.min(re.length,Math.floor(C*0.2));
 const idx=[];for(let i=0;i<C-R;i++)idx.push(i);
 for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t}
 const cyc=idx.map(i=>({f:i}));
 if(R>0){
  const rid=[];for(let j=0;j<re.length;j++)rid.push(j);
  for(let i=rid.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=rid[i];rid[i]=rid[j];rid[j]=t}
  const step=C/R,usa=new Set();
  for(let j=0;j<R;j++){
   let p=Math.floor(j*step+Math.floor(rnd()*step*0.5));
   if(usa.has(p))p=(p+1)%C;
   if(usa.has(p))continue;
   usa.add(p);cyc[p]={r:re[rid[j]]};
  }
 }
 return cyc;
};

    DB.pref=DB.pref||{};DB.pref.av=c;save();render();
  }catch(e){}
}
function random(){
  try{
    DB.pref=DB.pref||{};
    DB.pref.av={f:FORMAS[Math.random()*FORMAS.length|0],c:COLORES[Math.random()*COLORES.length|0],
      o:(Math.random()*OJOS|0),b:(Math.random()*BOCAS|0),a:(Math.random()*ACCS|0)};
    save();render();
  }catch(e){}
}


function ojo(x,y,tipo,col){
  if(tipo===2)return`<path d="M${x-4} ${y}q2 -3 4 0" style="fill:none;stroke:${col};stroke-width:2;stroke-linecap:round"/>`;
  const gui=`<circle cx="${x+3}" cy="${y}" r="2" style="fill:${col}"/>`;
  const bri=(tipo===1)?`<circle cx="${x+1.5}" cy="${y-1.5}" r="1.1" style="fill:#fff"/>`:('' );
  return`<circle cx="${x}" cy="${y}" r="2.8" style="fill:#fff"/>${gui}${bri}`;
}
function ojos(f,tipo,col){
  const g=FINFO[f]||FINFO.punto,d=Math.min(14,g.cw*0.24);
  if(f==='robot'&&tipo!==2){
    if(tipo===3)return`<path d="M${50-d-5} ${g.ey+2}q5 -7 10 0" style="fill:none;stroke:${col};stroke-width:2.2;stroke-linecap:round"/><path d="M${50+d-5} ${g.ey+2}q5 -7 10 0" style="fill:none;stroke:${col};stroke-width:2.2;stroke-linecap:round"/>`;
    return`<rect x="${50-d-5}" y="${g.ey-4.5}" width="10" height="9" rx="2.5" style="fill:${col}"/><rect x="${50+d-5}" y="${g.ey-4.5}" width="10" height="9" rx="2.5" style="fill:${col}"/>`;
  }
  if(tipo===3)return`<path d="M${50-d-5} ${g.ey+1.5}q5 -6 10 0" style="fill:none;stroke:${col};stroke-width:2.2;stroke-linecap:round"/><path d="M${50+d-5} ${g.ey+1.5}q5 -6 10 0" style="fill:none;stroke:${col};stroke-width:2.2;stroke-linecap:round"/>`;
  return ojo(50-d,g.ey,tipo,col)+ojo(50+d,g.ey,tipo,col);
}
function boca(f,tipo){
  const g=FINFO[f]||FINFO.punto,y=g.ey+9.5,s='fill:none;stroke:rgba(0,0,0,.6);stroke-width:2;stroke-linecap:round';
  if(tipo===1)return`<circle cx="50" cy="${y+1}" r="2.8" style="fill:rgba(0,0,0,.6)"/>`;
  if(tipo===2)return`<path d="M46 ${y}q4 5.5 8 0" style="${s}"/><path d="M49.2 ${y+3.4}q2.4 3.4 4.8 .2l-1.1 3.8z" style="fill:#e75480"/>`;
  if(tipo===3)return`<path d="M46 ${y+1.5}h8" style="${s}"/>`;
  return`<path d="M45.5 ${y-1}q4.5 5.5 9 0" style="${s}"/>`;
}

/* accesorios anclados a la cabeza de cada forma */
function accesorio(tipo,f,colBase){
  if(!tipo)return'';
  const g=FINFO[f]||FINFO.punto,ty=g.ty,cw=g.cw,x0=50-cw/2;
  if(tipo===1){ /* gorra: cúpula + visera + botón */
    const dom=`<path d="M${x0+3} ${ty+5}q3 -14 ${cw-6} 0z" style="fill:#dc2626"/>`;
    const vis=`<rect x="${x0+2}" y="${ty+1}" width="${cw-4}" height="6" rx="3" style="fill:#b91c1c"/>`;
    const bot=`<circle cx="50" cy="${ty-6}" r="3" style="fill:#fca5a5"/>`;
    return dom+vis+bot;
  }
  if(tipo===2||tipo===5){ /* gafas (2) o lentes de sol (5) */
    const h=11,gw=cw*0.29,gap=cw*0.18;
    const xL=50-gap/2-gw,boton=xL+gw-8,t='fill:'+(tipo===5?'rgba(30,41,59,.88)':'rgba(15,23,42,.18)')+';stroke:#1f2430;stroke-width:2';
    return`<rect x="${xL}" y="${g.ey-5}" width="${gw}" height="${h}" rx="4" style="${t}"/>`
     +`<rect x="${50+gap/2}" y="${g.ey-5}" width="${gw}" height="${h}" rx="4" style="${t}"/>`
     +`<path d="M${50-gap/2-2} ${g.ey+1}h${gap+4}M${xL} ${g.ey+1}l-8 2M${50+gap/2+2} ${g.ey+1}l8 1" style="fill:none;stroke:#1f2430;stroke-width:2;stroke-linecap:round"/>`
     +(tipo===5?`<path d="M${xL+5} ${g.ey-3}l6 4" style="stroke:rgba(255,255,255,.35);stroke-width:2;stroke-linecap:round"/>`:'' );
  }
  if(tipo===3){ /* moño lateral */
    return`<path d="M${x0-2} ${ty+6}c-7-7-16-2-12 4 2 5 10 5 14 2l-3.5 7.5 9-5.5z" style="fill:#e75480"/><circle cx="${x0+2}" cy="${ty+11}" r="2" style="fill:#f9a8d4"/>`;
  }
  if(tipo===4){ /* corona */
    const w=cw*0.62,l=50-w/2;
    return`<path d="M${l} ${ty+2}l3.5-10 6.5 7 6-10 7 10 6.5-7 3.5 10z" style="fill:#fbbf24"/><path d="M${l} ${ty+2}h${w}v3.5h-${w}z" style="fill:#f59e0b"/><circle cx="${50}" cy="${ty-1}" r="1.8" style="fill:#fde68a"/>`;
  }
  if(tipo===6){ /* auriculares: diadema acolchada con brillo + copas ovaladas con interior */
    const p=cw/2+5,yb=g.ey+3,tp=g.ty-13;
    const cpcb='#334155',cpin='#475569';
    const copa=sx=>`<ellipse cx="${50+sx*p}" cy="${yb+5}" rx="6.8" ry="10" style="fill:${cpcb};stroke:rgba(0,0,0,.25);stroke-width:1.5"/>`
      +`<ellipse cx="${50+sx*p}" cy="${yb+5}" rx="4.1" ry="6.8" style="fill:${cpin}"/>`
      +`<circle cx="${50+sx*p}" cy="${yb+1.5}" r="1.5" style="fill:rgba(255,255,255,.38)"/>`
      +`<rect x="${50+sx*p-2}" y="${yb-9}" width="4" height="8" rx="2" style="fill:${cpcb}"/>`;
    return`<path d="M${50-p-3} ${yb} C ${50-p-3} ${tp} ${50+p+3} ${tp} ${50+p+3} ${yb}" style="fill:none;stroke:${cpcb};stroke-width:5.5;stroke-linecap:round"/>`
      +`<path d="M${50-p-3} ${yb-1.5} C ${50-p-3} ${tp+4} ${50+p+3} ${tp+4} ${50+p+3} ${yb-1.5}" style="fill:none;stroke:rgba(255,255,255,.30);stroke-width:1.6;stroke-linecap:round"/>`
      +copa(-1)+copa(1);
  }
  return'';
}

/* ---------- editor v40: consola de creacion (preview grande a la izquierda, categorias en columna y rejilla de opciones a la derecha) ---------- */
var RSCAT='f';
var CATS=[['f','forma','forma'],['c','paleta','color'],['o','ojo','ojos'],['b','boca','boca'],['a','gorra','accesorio']];
function ic40(n){try{return(window.RS35&&RS35.ico)?RS35.ico(n):''}catch(e){return''}}
function nombreCat(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][2];return'forma'}
function tilesDe(k,actual){
  var vals,nombres;
  if(k==='f'){vals=FORMAS;nombres=FORMAS.map(function(x){return NOMF[x]})}
  else if(k==='c'){vals=COLORES;nombres=NOMC}
  else if(k==='o'){vals=[0,1,2,3];nombres=NOMO}
  else if(k==='b'){vals=[0,1,2,3];nombres=NOMB}
  else{vals=[0,1,2,3,4,5,6];nombres=NOMA}
  return vals.map(function(v,i){
    var valor=String(v);
    var on=valor===String(actual)?' on':'';
    var nm=nombres[i]||valor;
    if(k==='c'){
      var col=v||'var(--ac)';
      return`<button class="rs40sw${on}" data-a="rs37v" data-v="c:${valor}" title="${nm}" aria-label="Color ${nm}" aria-pressed="${on?'true':'false'}" style="--sw:${col}"></button>`;
    }
    var c2=Object.assign({},cfg());c2[k]=(k==='f')?v:v;
    return`<button class="rs40t${on}" data-a="rs37v" data-v="${k}:${valor}" title="${nm}" aria-label="${nombreCat(k)}: ${nm}" aria-pressed="${on?'true':'false'}"><span class="rs40mv" aria-hidden="true">${avatarSVG(c2,'neutro')}</span></button>`;
  }).join('');
}

function inyectarPerfil(){

<script>
/* ---- v39: consola de estudio (barra lateral con tiles de icono, marca propia y banner de seccion) ----
   Inspiracion general del estilo ed-tech de consola, con identidad 100% propia:
   - glifo geometrico de cinco puntos (marca) y wordmark propio; ni logos ni mascotas de terceros.
   - iconos del catalogo v35 en tiles redondeados; etiquetas propias de cada seccion.
   - banner de seccion con el acento de la paleta elegida por el usuario (var(--ac)).
   - escritorio: barra lateral ancha (icono + etiqueta en fila); movil conserva la barra inferior.
   Inyeccion idempotente tras cada render + observador ligero (mismo patron v35). */
(function(){
'use strict';

/* ---------- 1) textos propios por seccion ---------- */
var SUBT={
 camino:'Tu ruta de practica diaria',
 cuentos:'Lectura critica paso a paso',
 repaso:'Practica tus errores pasada',
 carreras:'Evalua tu nivel en cada linea',
 liga:'Tu division de esta semana',
 perfil:'Tu progreso y ajustes'
};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- 2) glifo de marca: pentagono de cinco puntos ---------- */
function glifo(){
 return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" focusable="false">'
 +'<path d="M12 4.6 19.5 10.2l-2.8 8.8H7.3L4.5 10.2z" opacity=".55"/>'
 +'<circle cx="12" cy="4.6" r="2" fill="currentColor" stroke="none"/>'
 +'<circle cx="19.5" cy="10.2" r="2" fill="currentColor" stroke="none"/>'
 +'<circle cx="16.7" cy="19" r="2" fill="currentColor" stroke="none"/>'
 +'<circle cx="7.3" cy="19" r="2" fill="currentColor" stroke="none"/>'
 +'<circle cx="4.5" cy="10.2" r="2" fill="currentColor" stroke="none"/>'
 +'</svg>';
}

/* ---------- 3) CSS ---------- */
function css(){
 if(document.getElementById('rs39css'))return;
 var s=document.createElement('style');s.id='rs39css';
 s.textContent=[
  /* banner de seccion */
  '.rs39ban{display:flex;flex-direction:column;gap:2px;background:var(--ac);color:#fff;',
   'border-radius:16px;padding:14px 18px;margin:0 0 14px;',
   'box-shadow:0 6px 16px rgba(15,23,42,.16)}',
  '.rs39ban b{font-size:15px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}',
  '.rs39ban span{font-size:13.5px;opacity:.92}',
  /* marca propia dentro de la barra lateral */
  '.rs39brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px;margin-bottom:8px;',
   'border-bottom:1px solid var(--br)}',
  '.rs39brand svg{width:34px;height:34px;color:var(--ac);flex:0 0 auto}',
  '.rs39brand .rs39w{font-size:12.5px;font-weight:800;letter-spacing:.16em;line-height:1.35;color:var(--tx)}',
  /* escritorio: barra lateral ancha con filas icono+etiqueta */
  '@media(min-width:768px){',
  ' nav{width:216px!important;padding:14px 12px 16px!important;justify-content:flex-start!important}',
  ' .app{padding-left:216px!important}',
  ' nav button{flex-direction:row!important;justify-content:flex-start!important;gap:12px!important;',
   'padding:9px 10px!important;border-radius:12px!important;font-size:13.5px!important;color:var(--mu)}',
  ' nav button:hover{background:rgba(127,127,127,.07)}',
  ' nav button span{width:38px!important;height:38px!important;border-radius:12px!important;',
   'display:grid!important;place-items:center!important;background:rgba(127,127,127,.10);margin:0!important;font-size:0}',
  ' nav button span svg{width:21px!important;height:21px!important}',
  ' nav button.on{color:var(--tx)}',
  ' nav button.on span{background:var(--ac)!important;color:#fff!important}',
  '}',
  /* movil: la marca no aparece en la barra inferior; tiles compactos iguales a antes */
  '@media(max-width:767px){.rs39brand{display:none}}',
  '@media(prefers-reduced-motion:no-preference){',
  ' .rs39ban{transition:transform .18s ease}',
  '}'
 ].join('\n');
 document.head.appendChild(s);
}

/* ---------- 4) inyeccion idempotente ---------- */
function inyectar(){
 try{
  css();
  /* marca solo en escritorio (en movil la barra es inferior y compacta) */
  var nav=document.querySelector('#app nav')||document.querySelector('nav');
  if(nav){
   if(!nav.querySelector('.rs39brand')){
    var b=document.createElement('div');b.className='rs39brand';b.setAttribute('data-v39','1');
    b.innerHTML=glifo()+'<span class="rs39w">CINCO<br>PUNTOS</span>';
    nav.insertBefore(b,nav.firstChild);
   }
  }
  /* banner de seccion solo en vistas de app (con .top directo), no en leccion/evaluacion */
  var main=document.querySelector('main');
  if(!main)return;
  var top=main.querySelector(':scope>.top');
  if(!top)return;
  var ya=main.querySelector('.rs39ban');
  var ab=nav&&nav.querySelector('button.on[data-a="tab"]');
  var k=ab?ab.dataset.v:null;
  if(!k||!SUBT[k])return;
  if(ya&&ya.dataset.k===k)return;
  if(ya&&ya.remove)ya.remove();
  var ban=document.createElement('div');ban.className='rs39ban';ban.setAttribute('data-v39','1');ban.dataset.k=k;
  ban.innerHTML='<b>'+esc(k)+'</b><span>'+esc(SUBT[k])+'</span>';
  top.insertAdjacentElement('afterend',ban);
 }catch(e){}
}

/* ---------- 5) cableado: wrapper de render + observador ---------- */
try{
 var _r39=render;
 render=function(){var r=_r39.apply(this,arguments);try{inyectar()}catch(e){}return r};
}catch(e){}
try{setTimeout(inyectar,0)}catch(e){}
try{
 var _t39=0;
 var mo39=new MutationObserver(function(){
  if(_t39)return;
  _t39=setTimeout(function(){_t39=0;try{inyectar()}catch(e){}},60);
 });
 mo39.observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

/* API para pruebas e integracion */
try{window.RS39={inyectar:inyectar,SUBT:SUBT,glifo:glifo}}catch(e){}

})();
</script>
<script>
/* ---- v41: pestañas del perfil + texto que encaja + ligas y duelos con personas reales ----
   Aquí vive:
   (b) encaje de texto en chips/casillas sobre todo en móvil vertical,
   (c) refuerzo de las pestañas internas del perfil: Personalizar / Progreso / Ajustes
       (la barra y la acción viven en el código base; aquí se oculta/muestra el editor),
   (d) ligas y duelos con personas reales: si la nube está activa y el proyecto
       ejecutó supabase/ligas.sql, se leen filas reales de la vista liga_publica
       y se puede duelar contra ellas; sin nube, todo queda como antes (cuentas locales). */
(function(){
'use strict';
if(typeof window==='undefined')return;

/* ---------- (b) encaje de texto y ajustes visuales ---------- */
function css(){
  if(document.getElementById('rs41css'))return;
  var est=document.createElement('style');est.id='rs41css';
  est.textContent=[
    /* el editor de mascota solo vive en la pestaña Personalizar */
    'body[data-rsptab]:not([data-rsptab="perso"]) [data-v40]{display:none!important}',
    /* el texto siempre cabe dentro de botones, chips, filas y tarjetas */
    'button{min-width:0;max-width:100%;overflow-wrap:anywhere;white-space:normal}',
    '.chip{max-width:100%;min-width:0}',
    '.lg span{min-width:0;flex:1 1 auto}',
    '.lg .g{flex:0 0 auto;margin-left:8px;min-height:34px;padding:4px 10px;font-size:13px}',
    '.rs40nom,.rs40ttl{max-width:100%;overflow-wrap:anywhere}',
    '.rs39brand{max-width:100%;overflow:hidden}',
    /* móvil vertical: compactar para que nada se salga de su caja */
    '@media(max-width:480px){',
    ' .chip{font-size:13px;padding:7px 11px;min-height:40px}',
    ' .lg{font-size:14px;gap:6px;padding:9px 10px}',
    ' .lg .g{margin-left:6px;font-size:12px;padding:4px 8px}',
    ' .opt{font-size:15px}',
    ' .rs40t{width:56px;min-height:56px}',
    ' .rs40sw{width:31px;min-height:31px}}'
  ].join('');document.head.appendChild(est);
}

/* ---------- (d) personas reales de la nube (vista liga_publica) ---------- */
var REM=[],fetched=false,fetching=false,cuando=0;
var STANDALONE=true;
try{STANDALONE=window.self===window.parent}catch(e){}

function cfgNube(){var c=window.RS_NUBE||{};return (c.url&&c.clave)?c:null}

function traerNube(forzar){
  if(!STANDALONE)return;
  if(!cfgNube()||!window.supabase)return;
  if(fetching)return;
  if(fetched&&!forzar&&Date.now()-cuando<60000)return;
  fetching=true;
  try{
    var c=cfgNube();
    var sb=window.supabase.createClient(c.url,c.clave);
    sb.from('liga_publica').select('nombre,liga,wk,wxp,xp,ok,tot').limit(200)
      .then(function(r){
        fetching=false;fetched=true;cuando=Date.now();
        var d=(r&&r.data)||[];
        if(r&&r.error){REM=[];return}
        var vistos={},out=[];
        d.forEach(function(f){
          var n=(f.nombre||'').trim();
          if(!n)return;
          if(vistos[n]){var v=vistos[n];if((f.wxp||0)>(v.wxp||0))vistos[n]=f;return}
          vistos[n]={n:n,liga:f.liga|0,wk:f.wk|0,wxp:f.wxp|0,xp:f.xp|0,ok:f.ok|0,tot:f.tot|0,rs:1};
          out.push(vistos[n]);
        });
        REM=out;
        repintar();
      });
  }catch(e){fetching=false}
}

function repintar(){
  try{
    if(typeof S==='undefined'||!S||S.view!=='app'||S.L)return;
    if(S.tab!=='liga'&&S.tab!=='perfil')return;
    if(typeof render!=='function')return;
    var cont=document.querySelector('main .lg');
    if(cont&&!cont.hasAttribute('data-rs41')){cont.setAttribute('data-rs41','1');render()}
  }catch(e){}
}

/* filas reales de la semana y liga indicadas, excluyendo a quien marca me */
function reales(w,l,nombreMe){
  return REM.filter(function(r){return r.wk===w&&r.liga===l&&r.n!==nombreMe});
}

/* accesor del tablero: suma las filas de la nube a las locales */
function instalarTablero(){
  var b0=null;
  try{b0=window.board}catch(e){b0=null}
  if(typeof b0!=='function'||window.board.__rs41)return;
  var board0=b0;
  window.board=function(w,l,fr,me){
    var mi=(me&&me.length)?me[me.length-1]:null;
    var nomMe=(mi&&mi.me)?mi.n:null;
    var extra=reales(w,l,nomMe).map(function(r){return{n:r.n,xp:Math.round(r.wxp*Math.max(0,fr)),rs:1}});
    return board0(w,l,fr,extra.concat(me||[]));
  };
  window.board.__rs41=1;
}

/* 10 preguntas sin audio (equivalente a sinAudio, que no es visible desde módulos) */
function preguntasSinAudio(){
  var qs=[],t;
  AR.forEach(function(a){
    var o=draw(a,null,2).filter(function(q){return !q.audio}),k=2;t=0;
    while(o.length<k&&t++<8){var x=draw(a,null,1)[0];if(x&&!x.audio&&!o.some(function(y){return y.id===x.id}))o.push(x)}
    qs=qs.concat(o);
  });
  return qs;
}

/* duelar contra una persona real (o de este dispositivo): 10 preguntas,
   el rival contesta según su precisión real registrada en la nube */
function duelar(nom){
  var u=U();
  var r=REM.filter(function(x){return x.n===nom})[0];
  var loc=Object.values(DB.users).filter(function(x){return x!==u&&x.name===nom})[0];
  var base=[.4,.55,.7][u.liga]||.4,p=base;
  if(r&&r.tot>4)p=Math.max(.25,Math.min(.85,r.ok/r.tot));
  else if(loc&&loc.tot>4)p=Math.max(.25,Math.min(.85,loc.ok/loc.tot));
  S.L=mk('duel',preguntasSinAudio(),{bn:nom,bp:p,bs:0,su:0,bl:[],rival:1});
  render();
}

function instalarAcciones(){
  try{
    if(typeof A==='undefined')return;
    var refuerzo={};
    if(!A.ptab)refuerzo.ptab=function(v){S.ptab=v;S.L=null;S.R=null;stopTTS();render()};
    refuerzo.rs41d=function(v){
      try{duelar(decodeURIComponent(v||''))}catch(e){}
    };
    Object.assign(A,refuerzo);
  }catch(e){}
}

/* ---------- refuerzo de pestañas del perfil (si el parche base faltara) ---------- */
function reforzarPestanas(){
  try{
    if(typeof S==='undefined')return;
    if(S.view==='app'&&S.tab==='perfil'&&!S.L){
      if(!S.ptab)S.ptab='prog';
      if(typeof render==='function'){
        var main=document.querySelector('main');
        if(main&&!main.querySelector('.rs41pc')){
          main.insertAdjacentHTML('afterbegin',
            '<div class="row rs41pc" style="margin-bottom:6px">'+[['perso','Personalizar'],['prog','Progreso'],['ajus','Ajustes']]
            .map(function(t){return '<button class="chip'+(S.ptab===t[0]?' on':'')+'" data-a="ptab" data-v="'+t[0]+'" aria-pressed="'+(S.ptab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>');
        }
      }
    }
  }catch(e){}
}

function instalarRender(){
  if(window.__rs41render)return;
  if(typeof render!=='function')return;
  var r0=render;
  render=function(){
    try{if(typeof S!=='undefined'&&S&&S.view==='app'&&S.tab==='perfil'&&!S.L&&!S.ptab)S.ptab='prog'}catch(e){}
    var out=r0.apply(this,arguments);
    try{
      document.body.setAttribute('data-rsptab',(typeof S!=='undefined'&&S&&S.ptab)||'');
      if(typeof S!=='undefined'&&S&&S.view==='app')traerNube(false);
      reforzarPestanas();
    }catch(e){}
    return out;
  };
  window.__rs41render=1;
}

css();
instalarAcciones();
instalarTablero();
instalarRender();

window.RS41={
  reales:reales,
  traerNube:traerNube,
  duelar:duelar,
  estado:function(){return{rem:REM.length,fetched:fetched,configurado:!!cfgNube(),standalone:STANDALONE}}
};
})();


</script>
