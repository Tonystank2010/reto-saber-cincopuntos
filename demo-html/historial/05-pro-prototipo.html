<title>Reto Pro de 5.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: one phone-width app column, bottom tab bar, cards per area. Brand of 5.: coral star + one color per módulo */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --ink:#1C1A33; --muted:#6B6888; --line:#E4E2EF;
  --coral:#FF5C5C; --sun:#FFB423; --navy:#24204A;
  --lc:#7B3FE4; --rc:#2F7BF5; --cc:#F27A2E; --ce:#11A795; --en:#F0468F;
  --ok:#14915A; --okbg:#DDF5E8; --bad:#C62E3A; --badbg:#FDE2E4;
  --display:"Outfit","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13121F; --surface:#1E1C30; --ink:#F2F0FF; --muted:#A9A6C6; --line:#33304D;
  --navy:#2D2860; --okbg:#123826; --ok:#5BD69A; --badbg:#3D1A20; --bad:#FF8A94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121F; --surface:#1E1C30; --ink:#F2F0FF; --muted:#A9A6C6; --line:#33304D;
  --navy:#2D2860; --okbg:#123826; --ok:#5BD69A; --badbg:#3D1A20; --bad:#FF8A94; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:800;font-size:30px;color:var(--coral);line-height:1}
.logo i{color:var(--sun);font-style:normal}
.brand b{display:block;font-family:var(--display);font-size:19px}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.chips{margin-left:auto;display:flex;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg small{display:block;font-weight:600;font-size:11px;opacity:.85}
.hero{background:linear-gradient(135deg,var(--navy),#4B3FA8 70%,var(--lc));color:#fff;border-radius:24px;padding:18px;display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center}
.hero .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--sun)}
.hero h1{font-size:23px;margin:4px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--coral);color:#fff;font-weight:800;padding:11px 18px;border-radius:14px;box-shadow:0 4px 0 #C93C45}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #C93C45}
.btn.sun{background:var(--sun);color:#2A1B00;box-shadow:0 4px 0 #C98A0A}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sec-h h2{font-size:17px}
.sec-h span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{border-radius:18px;padding:12px;color:#fff;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 0 rgba(0,0,0,.18);background:var(--c)}
.mod.full{grid-column:1/-1;min-height:76px;flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.mod .ic{font-family:var(--display);font-weight:800;font-size:13px;background:rgba(255,255,255,.22);border-radius:8px;padding:2px 8px;align-self:flex-start}
.mod b{font-family:var(--display);font-size:16px;line-height:1.2}
.mod small{display:block;font-size:12px;opacity:.9}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:16px}
.muted{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.facts dt{font-weight:800}
.facts dd{margin:0;color:var(--muted)}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.x{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:800}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:8px;border-radius:8px;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.now{background:var(--sun)}
.hearts{font-weight:800;color:var(--coral);font-variant-numeric:tabular-nums}
.timer{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--sun);transition:width 1s linear}
.mtag{align-self:flex-start;color:#fff;background:var(--c);font-weight:800;font-size:12px;border-radius:8px;padding:2px 10px}
.ctx{background:var(--bg);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;font-size:14px}
.qq{font-weight:800;font-size:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start}
.opt .l{font-family:var(--display);font-weight:800;min-width:24px;height:24px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:13px}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.why{border-radius:14px;padding:12px;font-size:14px}
.why.ok{background:var(--okbg)} .why.bad{background:var(--badbg)}
.why b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.end{text-align:center;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
/* writing */
textarea,select{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
textarea{min-height:200px;resize:vertical}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.counters div{background:var(--bg);border-radius:10px;padding:6px 2px}
.counters b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.counters small{font-size:11px;color:var(--muted)}
.rub{display:grid;grid-template-columns:110px 1fr 40px;gap:6px 10px;align-items:center;font-size:13px}
.rub .t{height:10px;background:var(--line);border-radius:10px;overflow:hidden}
.rub .t i{display:block;height:100%;background:var(--ce)}
.tips{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
/* ruta */
.path{display:flex;flex-direction:column;gap:0}
.stop{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px 0}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--line);color:var(--muted)}
.stop.on .node{background:var(--sun);color:#2A1B00}
.stop.now .node{background:var(--coral);color:#fff;box-shadow:0 0 0 5px rgba(255,92,92,.25)}
.stop b{font-family:var(--display)}
.plan{border:2px solid var(--line);border-radius:18px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.plan.hot{border-color:var(--coral)}
.plan .price{font-family:var(--display);font-weight:800;font-size:24px}
.plan ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.ribbon{align-self:flex-start;background:var(--sun);color:#2A1B00;font-weight:800;font-size:11px;border-radius:6px;padding:2px 8px;letter-spacing:.06em;text-transform:uppercase}
.note{font-size:12px;color:var(--muted);text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--coral)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;z-index:6}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:7}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.92)}100%{transform:scale(1)}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="Secciones"><div id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>
<canvas class="confetti" id="cf" hidden></canvas>

<script>
const STAR = (cap=true, size=104) => `<svg width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">
<path d="M60 14l13 28 30 3-23 20 7 30-27-16-27 16 7-30-23-20 30-3z" fill="#FFC93C" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round"/>
<circle cx="50" cy="60" r="4" fill="#2A1B00"/><circle cx="70" cy="60" r="4" fill="#2A1B00"/>
<path d="M50 71q10 9 20 0" stroke="#2A1B00" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="43" cy="69" r="4" fill="#FF8A80" opacity=".7"/><circle cx="77" cy="69" r="4" fill="#FF8A80" opacity=".7"/>
${cap?`<path d="M30 30l30-12 30 12-30 12z" fill="#1C1A33"/><path d="M44 36v10q16 8 32 0V36l-16 6z" fill="#1C1A33"/><path d="M88 31v16" stroke="#FFC93C" stroke-width="3"/><circle cx="88" cy="49" r="3.5" fill="#FFC93C"/>`:''}
</svg>`;

const MOD = {
  lc:{n:"Lectura Crítica", s:"LC", c:"var(--lc)"},
  rc:{n:"Razonamiento Cuantitativo", s:"RC", c:"var(--rc)"},
  cc:{n:"Competencias Ciudadanas", s:"CC", c:"var(--cc)"},
  ce:{n:"Comunicación Escrita", s:"CE", c:"var(--ce)"},
  en:{n:"Inglés", s:"EN", c:"var(--en)"}
};

// Preguntas originales de práctica (estilo de los módulos genéricos; no son preguntas del Icfes)
const Q = [
 {m:"lc", ctx:"«Las empresas que adoptaron el trabajo remoto reportan menos ausentismo. Sin embargo, varios estudios advierten que la frontera entre la vida laboral y la personal se diluye, y que el costo de esa mezcla lo pagan sobre todo quienes cuidan a otros en casa.»",
  q:"¿Cuál es la intención principal del autor?", o:["Demostrar que el trabajo remoto debe prohibirse","Matizar un beneficio del trabajo remoto mostrando un costo que no se reparte por igual","Explicar cómo se mide el ausentismo en las empresas","Convencer a los cuidadores de volver a la oficina"], a:1,
  why:"El texto reconoce un beneficio («menos ausentismo») y con «Sin embargo» introduce un costo que afecta más a un grupo. Eso es matizar, no rechazar."},
 {m:"lc", ctx:"«Si la universidad amplía la biblioteca, más estudiantes la usarán; por eso la rectoría propone ampliarla para mejorar los resultados en Saber Pro.»",
  q:"¿Qué supuesto, no dicho, necesita el argumento?", o:["Que la biblioteca actual es antigua","Que usar más la biblioteca mejora el desempeño en la prueba","Que todos los estudiantes leen en papel","Que Saber Pro evalúa el uso de bibliotecas"], a:1,
  why:"El argumento salta de «más uso» a «mejores resultados». Para que funcione, hay que suponer que usar la biblioteca mejora el desempeño."},
 {m:"lc", ctx:"Un concejal dice: «No podemos aceptar la propuesta de ciclorrutas de mi colega; él ni siquiera tiene bicicleta.»",
  q:"¿Qué problema tiene este razonamiento?", o:["Ataca a la persona en lugar de discutir la propuesta","Usa datos estadísticos falsos","Generaliza a partir de un solo caso","Confunde causa con consecuencia"], a:0,
  why:"Es un ataque personal (falacia ad hominem): que el colega no tenga bicicleta no dice nada sobre si las ciclorrutas son buena idea."},
 {m:"lc", ctx:"Un artículo de opinión termina así: «Mientras sigamos midiendo el éxito escolar solo con puntajes, seguiremos formando buenos examinados y no necesariamente buenos ciudadanos.»",
  q:"¿Qué enunciado resume mejor la postura del autor?", o:["Los exámenes deberían eliminarse por completo","Los puntajes son una medida incompleta de la formación","Los buenos ciudadanos obtienen bajos puntajes","La escuela no debe preparar para exámenes"], a:1,
  why:"El autor no pide eliminar exámenes; critica que sean la única medida («solo con puntajes»). Por eso los ve como una medida incompleta."},
 {m:"rc", q:"Un curso en línea cuesta $200.000. Sube 20% en enero y en marzo tiene un descuento del 20% sobre el nuevo precio. ¿Cuánto cuesta en marzo?", o:["$200.000","$192.000","$196.000","$160.000"], a:1,
  why:"200.000 × 1,20 = 240.000. Luego 240.000 × 0,80 = 192.000. Subir y bajar el mismo porcentaje no regresa al precio inicial."},
 {m:"rc", q:"3 técnicos instalan una red en 12 días. Trabajando al mismo ritmo, ¿cuántos días tardarían 4 técnicos?", o:["16 días","9 días","8 días","10 días"], a:1,
  why:"Es proporcionalidad inversa: 3 × 12 = 36 días-técnico. 36 ÷ 4 = 9 días."},
 {m:"rc", ctx:"En un grupo de 40 estudiantes, 25 aprobaron Estadística, 18 aprobaron Cálculo y 10 aprobaron ambas.", q:"¿Cuántos estudiantes no aprobaron ninguna de las dos?", o:["7","3","12","0"], a:0,
  why:"Aprobaron al menos una: 25 + 18 − 10 = 33. Ninguna: 40 − 33 = 7."},
 {m:"rc", ctx:"Ventas de una tienda (millones de pesos): enero 8, febrero 10, marzo 12, abril 10.", q:"¿Qué afirmación es correcta?", o:["El promedio mensual fue 11 millones","Marzo vendió 50% más que enero","Las ventas crecieron todos los meses","Abril vendió 20% menos que febrero"], a:1,
  why:"12 es 50% más que 8 (8 × 1,5 = 12). El promedio es 40 ÷ 4 = 10, abril no creció y abril igualó a febrero."},
 {m:"cc", q:"Una persona considera que una EPS le está vulnerando el derecho a la salud y necesita una protección rápida. ¿Qué mecanismo es el más adecuado?", o:["Acción de tutela","Referendo","Cabildo abierto","Revocatoria del mandato"], a:0,
  why:"La acción de tutela (art. 86 de la Constitución) protege de forma inmediata los derechos fundamentales."},
 {m:"cc", q:"Según la Constitución de 1991, ¿qué rama del poder público tiene como función principal hacer las leyes?", o:["La rama ejecutiva","La rama legislativa (Congreso)","La rama judicial","Los órganos de control"], a:1,
  why:"El Congreso de la República, como rama legislativa, hace las leyes. La ejecutiva las ejecuta y la judicial administra justicia."},
 {m:"cc", ctx:"Una empresa quiere construir una planta cerca de un río. La alcaldía ve empleo; la comunidad pesquera teme por el agua; un grupo ambiental pide estudios.", q:"¿Qué opción reconoce mejor los distintos intereses?", o:["Aprobar la planta porque genera empleo","Rechazar la planta porque el río es importante","Abrir un espacio de diálogo con estudios técnicos y participación de todos los actores","Dejar que la empresa decida sola"], a:2,
  why:"Las competencias ciudadanas valoran identificar las perspectivas de todos y buscar soluciones que las tengan en cuenta, no imponer una sola."},
 {m:"cc", q:"¿Cuál de estos es un mecanismo de participación ciudadana establecido en el artículo 103 de la Constitución?", o:["La acción de tutela","La consulta popular","El derecho de petición","El habeas corpus"], a:1,
  why:"El artículo 103 enumera voto, plebiscito, referendo, consulta popular, cabildo abierto, iniciativa legislativa y revocatoria del mandato."},
 {m:"en", ctx:"Sign at a laboratory door: «AUTHORIZED STAFF ONLY. Safety glasses must be worn at all times.»", q:"What does the sign mean?", o:["Anyone can enter if they wear glasses","Only permitted people can enter, and they need eye protection","Glasses are sold inside","Staff can remove their glasses inside"], a:1,
  why:"«Authorized staff only» = solo personal autorizado. «Must be worn at all times» = siempre deben usar las gafas."},
 {m:"en", q:"Choose the correct option: «By the time I graduate, I ___ at this company for two years.»", o:["work","will have worked","have worked","am working"], a:1,
  why:"«By the time…» con una acción completada antes de un momento futuro pide el futuro perfecto: «will have worked»."},
 {m:"en", ctx:"«Although the internship was unpaid, Laura accepted it because it offered training she couldn't get anywhere else.»", q:"Why did Laura accept the internship?", o:["Because it paid well","Because it was close to her house","Because of the unique training","Because she had no other offers"], a:2,
  why:"La razón aparece después de «because»: «training she couldn't get anywhere else»."},
 {m:"en", q:"Which word completes the sentence? «The report was so ___ that the manager approved it without changes.»", o:["thorough","though","through","throw"], a:0,
  why:"«Thorough» significa completo, minucioso. «Though» (aunque), «through» (a través) y «throw» (lanzar) no encajan."}
];

const PROMPTS = [
 "¿Debería ser obligatorio que los estudiantes universitarios hagan prácticas laborales antes de graduarse? Escribe un texto argumentativo con tu postura.",
 "Algunas ciudades cobran por entrar en carro al centro para reducir la contaminación. ¿Estás de acuerdo? Argumenta tu respuesta.",
 "¿La inteligencia artificial debería usarse para hacer tareas universitarias? Toma una postura y defiéndela."
];

const LEVELS = [
 {xp:0, n:"Primíparo", d:"Arrancas tu ruta"},
 {xp:100, n:"Semestre 3", d:"Ya conoces los 5 módulos"},
 {xp:250, n:"Semestre 6", d:"Desbloqueas simulacros largos"},
 {xp:450, n:"Practicante", d:"Duelos con tu universidad"},
 {xp:700, n:"Egresado", d:"Simulacro completo de 4 h 40 min"},
 {xp:1000, n:"Grado con honores", d:"Insignia dorada en tu perfil"}
];

const S = { exam:"pro", view:"home", xp:180, streak:4, prog:{lc:62,rc:48,cc:55,ce:40,en:70}, quiz:null, write:{p:0, text:""}, result:null };
let timerId = null;

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const level = () => { let i = 0; LEVELS.forEach((l,k)=>{ if(S.xp>=l.xp) i=k; }); return i; };
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,1800); }

const ICONS = {
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 write:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
 ruta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5"/></svg>',
 plans:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>'
};
function tabs(){
  const t=[["home","Inicio"],["write","Escritura"],["ruta","Mi ruta"],["plans","Planes"]];
  $("#tabs").innerHTML = t.map(([k,n])=>`<button data-tab="${k}" ${S.view===k||(k==="home"&&S.view==="quiz")?'aria-current="page"':''}>${ICONS[k]}${n}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
function go(v){ stopTimer(); S.view=v; render(); window.scrollTo(0,0); }

function header(){
  return `<div class="top"><span class="logo">5<i>.</i></span><div class="brand"><b>Reto Pro</b><small>Una app de 5.</small></div>
  <div class="chips"><span class="chip" title="Racha">🔥 ${S.streak}</span><span class="chip" title="XP">★ ${S.xp.toLocaleString("es-CO")}</span></div></div>`;
}

function home(){
  const pro = S.exam==="pro";
  const mods = ["lc","rc","cc","en"].map(k=>`<button class="mod" style="--c:${MOD[k].c}" data-mod="${k}"><span class="ic">${MOD[k].s}</span><div><b>${MOD[k].n}</b><small>${S.prog[k]}/100 · ${S.prog[k]>=65?"Avanzado":S.prog[k]>=45?"Intermedio":"Básico"}</small><div class="bar"><i style="width:${S.prog[k]}%"></i></div></div></button>`).join("");
  return `${header()}
  <div class="seg" role="group" aria-label="Prueba">
    <button data-exam="pro" aria-pressed="${pro}">Saber Pro<small>Profesional universitario</small></button>
    <button data-exam="tyt" aria-pressed="${!pro}">Saber TyT<small>Técnico y tecnólogo</small></button>
  </div>
  <section class="hero pop">
    <div><span class="eyebrow">Reto del día · ${pro?"Saber Pro":"Saber TyT"}</span>
    <h1>5 preguntas, 3 vidas y 60 segundos por pregunta.</h1>
    <button class="btn sun" id="daily">Jugar ahora</button></div>
    <div>${STAR(true)}</div>
  </section>
  <div class="sec-h"><h2>Módulos genéricos</h2><span>Los mismos 5 en Pro y TyT</span></div>
  <div class="grid">${mods}
    <button class="mod full" style="--c:var(--ce)" data-go="write"><span class="ic">CE</span><div><b>Comunicación Escrita</b><small>Taller del ensayo: escribe y recibe revisión al instante</small></div></button>
  </div>
  <div class="card">
    <h3>Módulos específicos ${pro?"por carrera":"por área técnica"}</h3>
    <p class="muted">Cada programa presenta además módulos de su área. En el prototipo aparecen como próximos niveles.</p>
    <div class="tags">${(pro?["Ingenierías","Ciencias de la salud","Educación","Administración y negocios","Derecho","Ciencias sociales"]:["Procesos industriales","Salud","Gestión administrativa","Sistemas","Comercial y mercadeo"]).map(t=>`<span class="tag">🔒 ${t}</span>`).join("")}</div>
  </div>
  <div class="card">
    <h3>¿Qué es ${pro?"Saber Pro":"Saber TyT"}?</h3>
    <dl class="facts">
      <dt>Quién</dt><dd>${pro?"Estudiantes de últimos semestres de carreras profesionales universitarias":"Estudiantes de programas técnicos profesionales y tecnológicos"}</dd>
      <dt>Evalúa</dt><dd>Lectura crítica, razonamiento cuantitativo, competencias ciudadanas, comunicación escrita e inglés, más módulos específicos</dd>
      <dt>Duración</dt><dd>Hasta 4 h 40 min en una sesión (aplicación de octubre de 2026)</dd>
      ${pro?'<dt>Antes</dt><dd>Se llamaba ECAES (Exámenes de Calidad de la Educación Superior)</dd>':''}
    </dl>
    <p class="muted">Inscripciones y fechas oficiales: icfes.gov.co. Reto Pro no es del Icfes; las preguntas son propias, para practicar.</p>
  </div>`;
}

function startQuiz(list, title){
  S.quiz = { list, i:0, lives:3, ans:[], picked:null, time:60, title, gained:0 };
  S.view="quiz"; render(); window.scrollTo(0,0);
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function daily(){ const mods=["lc","rc","cc","en"]; const pick=shuffle(mods).concat([mods[Math.floor(Math.random()*4)]]).map(m=>shuffle(Q.filter(q=>q.m===m))[0]);
  const uniq=[...new Set(pick)]; while(uniq.length<5){ const q=shuffle(Q)[0]; if(!uniq.includes(q)&&q.m!=="ce") uniq.push(q);} startQuiz(uniq,"Reto del día"); }

function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }
function runTimer(){
  stopTimer();
  timerId=setInterval(()=>{ const z=S.quiz; if(!z||z.picked!==null){stopTimer();return;}
    z.time--; const bar=$("#tbar"); if(bar) bar.style.width=(z.time/60*100)+"%"; const tl=$("#tleft"); if(tl) tl.textContent=z.time+" s";
    if(z.time<=0){ answer(-1); } },1000);
}
function quiz(){
  const z=S.quiz; const q=z.list[z.i]; const md=MOD[q.m];
  const dots=z.list.map((_,k)=>`<i class="${k<z.ans.length?(z.ans[k]?"ok":"bad"):k===z.i?"now":""}"></i>`).join("");
  const L="ABCD";
  const opts=q.o.map((t,k)=>{ let cls=""; if(z.picked!==null){ if(k===q.a) cls="ok"; else if(k===z.picked) cls="bad"; }
    return `<button class="opt ${cls}" data-o="${k}" ${z.picked!==null?"disabled":""}><span class="l">${L[k]}</span><span>${esc(t)}</span></button>`; }).join("");
  const done=z.picked!==null; const right=done&&z.picked===q.a;
  return `<div class="qtop"><button class="x" data-go="home" aria-label="Salir">‹</button><div class="dots">${dots}</div><span class="hearts">♥ ${z.lives}</span></div>
  <div class="timer"><i id="tbar" style="width:${z.time/60*100}%"></i></div>
  <div class="card pop" style="--c:${md.c}">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="mtag">${md.n}</span><span class="muted" id="tleft">${done?"":z.time+" s"}</span></div>
    ${q.ctx?`<div class="ctx">${esc(q.ctx)}</div>`:""}
    <p class="qq">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${done?`<div class="why ${right?"ok":"bad"}"><b>${right?"¡Correcto! +20 XP":(z.picked===-1?"Se acabó el tiempo":"Casi. Mira por qué:")}</b>${esc(q.why)}</div>
    <button class="btn wide" id="next">${z.i===z.list.length-1||z.lives===0?"Ver resultado":"Siguiente"}</button>`:""}
  </div>`;
}
function answer(k){
  const z=S.quiz; if(z.picked!==null) return; stopTimer();
  const q=z.list[z.i]; z.picked=k; const ok=k===q.a; z.ans.push(ok);
  if(ok){ z.gained+=20; S.prog[q.m]=Math.min(100,S.prog[q.m]+3); } else z.lives--;
  render();
}
function next(){
  const z=S.quiz;
  if(z.i===z.list.length-1||z.lives===0){ const ok=z.ans.filter(Boolean).length; const bonus=ok===z.list.length?30:0;
    S.xp+=z.gained+bonus; S.result={ok,total:z.list.length,gained:z.gained+bonus,bonus,title:z.title,lives:z.lives}; S.quiz=null; S.view="result"; render(); if(ok>=Math.ceil(z.list.length*0.6)) confetti(); return; }
  z.i++; z.picked=null; z.time=60; render();
}
function result(){
  const r=S.result; const pct=Math.round(r.ok/r.total*100); const lv=LEVELS[level()];
  return `${header()}<div class="card end pop">${STAR(true,96)}
  <span class="muted">${esc(r.title)}</span><div class="big">${r.ok}/${r.total}</div>
  <p><b>+${r.gained} XP</b>${r.bonus?" (incluye +30 por ronda perfecta)":""}</p>
  <p class="muted">${r.lives===0?"Te quedaste sin vidas. Repasa las explicaciones y vuelve a intentarlo.":pct>=80?"¡Excelente! Vas camino al nivel avanzado.":pct>=60?"Bien. Un reto más y subes de nivel.":"Toca repasar. Las explicaciones te ayudan."}</p>
  <p class="muted">Nivel actual: <b>${lv.n}</b></p>
  <button class="btn wide" id="again">Otro reto</button><button class="btn ghost wide" data-go="home">Volver al inicio</button></div>`;
}

const CONNECT = ["además","sin embargo","por lo tanto","por consiguiente","en cambio","no obstante","por otra parte","así mismo","asimismo","en primer lugar","en segundo lugar","finalmente","por ejemplo","en conclusión","en síntesis","es decir","porque","debido a","aunque","por esta razón","de modo que","en consecuencia"];
const STANCE = ["considero","creo que","en mi opinión","estoy de acuerdo","no estoy de acuerdo","pienso que","defiendo","mi postura","es necesario","no debería","debería"];
const CLOSE = ["en conclusión","en síntesis","para concluir","finalmente","en resumen","por todo lo anterior"];
function analyze(t){
  const low=t.toLowerCase();
  const words=(t.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]+/g)||[]).length;
  const paras=t.split(/\n\s*\n|\n/).filter(p=>p.trim().split(/\s+/).length>=8).length;
  const con=CONNECT.filter(c=>low.includes(c));
  const stance=STANCE.some(s=>low.includes(s));
  const close=CLOSE.some(s=>low.includes(s));
  const sentences=(t.match(/[^.!?]+[.!?]/g)||[]);
  const longS=sentences.filter(s=>s.split(/\s+/).length>45).length;
  const ex=/por ejemplo|como es el caso|según|de acuerdo con|\d/.test(low);
  const plan=Math.min(100,(stance?55:15)+(ex?25:0)+(words>=150?20:words>=80?10:0));
  const org=Math.min(100,(paras>=3?45:paras*15)+Math.min(40,con.length*8)+(close?15:0));
  const forma=Math.max(0,Math.min(100,(words>=100?60:words*0.6)+(longS?0:25)+(/[A-ZÁÉÍÓÚÑ]/.test(t.trim()[0]||"")?15:0)));
  const tips=[];
  if(!stance) tips.push("Di tu postura desde el inicio: «Considero que…», «No estoy de acuerdo con…».");
  if(!ex) tips.push("Apoya tu idea con un ejemplo, un dato o un caso.");
  if(paras<3) tips.push("Organiza en 3 párrafos: postura, argumentos y conclusión.");
  if(con.length<3) tips.push("Usa conectores para unir ideas: «además», «sin embargo», «por lo tanto».");
  if(!close) tips.push("Cierra con una conclusión: «En conclusión…».");
  if(longS) tips.push("Hay oraciones muy largas. Divídelas para que se lean mejor.");
  if(words<150) tips.push("Apunta a unas 150 a 250 palabras.");
  if(!tips.length) tips.push("¡Muy buen texto! Revisa ortografía y tildes antes de entregar.");
  return {words,paras,con:con.length,plan,org,forma,total:Math.round((plan+org+forma)/3),tips};
}
function write(){
  const w=S.write; const a=analyze(w.text);
  return `${header()}
  <div class="card" style="--c:var(--ce)"><span class="mtag">Comunicación Escrita</span>
    <h3>Taller del ensayo</h3>
    <label class="muted" for="wp">Escoge el tema</label>
    <select id="wp">${PROMPTS.map((p,k)=>`<option value="${k}" ${k===w.p?"selected":""}>${esc(p)}</option>`).join("")}</select>
    <div class="ctx">${esc(PROMPTS[w.p])}</div>
    <label class="muted" for="wt">Tu texto</label>
    <textarea id="wt" placeholder="Considero que… En primer lugar… Además… En conclusión…">${esc(w.text)}</textarea>
    <div class="counters" id="cnt">${counters(a)}</div>
    <button class="btn wide" id="wcheck">Revisar mi texto</button>
  </div>
  <div class="card" id="wres" ${w.checked?"":"hidden"}>${w.checked?wres(a):""}</div>
  <p class="note">Revisión automática de práctica. Da pistas de estructura; no reemplaza la calificación del Icfes.</p>`;
}
function counters(a){ return `<div><b>${a.words}</b><small>palabras</small></div><div><b>${a.paras}</b><small>párrafos</small></div><div><b>${a.con}</b><small>conectores</small></div><div><b>${a.total}</b><small>puntaje</small></div>`; }
function wres(a){ const r=(n,v)=>`<span>${n}</span><span class="t"><i style="width:${v}%"></i></span><b>${v}</b>`;
  return `<h3>Tu revisión: ${a.total}/100</h3><div class="rub">${r("Planteamiento",Math.round(a.plan))}${r("Organización",Math.round(a.org))}${r("Forma",Math.round(a.forma))}</div><ul class="tips">${a.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`; }

function ruta(){
  const li=level(); const nx=LEVELS[li+1]; const pct=nx?Math.round((S.xp-LEVELS[li].xp)/(nx.xp-LEVELS[li].xp)*100):100;
  return `${header()}
  <div class="card"><h3>Tu ruta al grado</h3><p class="muted">${nx?`Te faltan <b>${nx.xp-S.xp} XP</b> para <b>${nx.n}</b>.`:"¡Llegaste a la cima!"}</p>
  <div class="timer" style="height:10px"><i style="width:${pct}%"></i></div></div>
  <div class="card"><div class="path">${LEVELS.map((l,k)=>`<div class="stop ${k<li?"on":k===li?"now":""}"><span class="node">${k+1}</span><div><b>${l.n}</b><p class="muted">${l.d} · ${l.xp} XP</p></div></div>`).join("")}</div></div>
  <div class="card"><h3>Diagnóstico por módulo</h3>
  ${Object.keys(MOD).map(k=>`<div class="rub" style="grid-template-columns:150px 1fr 34px"><span>${MOD[k].n}</span><span class="t"><i style="width:${S.prog[k]}%;background:${MOD[k].c}"></i></span><b>${S.prog[k]}</b></div>`).join("")}
  <p class="muted">Sube con cada respuesta correcta. Lo más débil se vuelve tu reto del día.</p></div>`;
}
function plans(){
  return `${header()}
  <div class="sec-h"><h2>Planes Reto Pro</h2><span>Precios de ejemplo</span></div>
  <div class="plan"><b>Gratis</b><span class="price">$0</span><ul><li>Reto del día con 3 vidas</li><li>Diagnóstico inicial</li><li>Sin guardar progreso</li></ul></div>
  <div class="plan hot"><span class="ribbon">Más elegido</span><b>Plan Pro semestral</b><span class="price">$29.900</span><ul><li>Retos ilimitados en los 5 módulos genéricos</li><li>Taller de escritura con revisión</li><li>Simulacro completo con tiempo real</li><li>Ranking con tu universidad</li></ul><button class="btn wide" id="buy">Quiero el plan</button></div>
  <div class="plan"><b>Plan Universidad</b><span class="price">Convenio</span><ul><li>Licencias para todo un programa académico</li><li>Informe por cohorte para la dirección del programa</li><li>Módulos específicos de la carrera</li></ul></div>
  <p class="note">Los precios son ilustrativos. Prueben valores en la hoja SIMULADOR del Excel de 5. antes de decidir.</p>`;
}

function render(){
  const app=$("#app");
  app.innerHTML = S.view==="home"?home():S.view==="quiz"?quiz():S.view==="result"?result():S.view==="write"?write():S.view==="ruta"?ruta():plans();
  tabs(); bind();
  if(S.view==="quiz"&&S.quiz&&S.quiz.picked===null) runTimer();
}
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>{S.exam=b.dataset.exam;render();toast(S.exam==="pro"?"Modo Saber Pro":"Modo Saber TyT");});
  document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>startQuiz(shuffle(Q.filter(q=>q.m===b.dataset.mod)),MOD[b.dataset.mod].n));
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  const d=$("#daily"); if(d) d.onclick=daily;
  const n=$("#next"); if(n) n.onclick=next;
  const ag=$("#again"); if(ag) ag.onclick=daily;
  const by=$("#buy"); if(by) by.onclick=()=>toast("En la beta no hay pagos reales");
  const wp=$("#wp"); if(wp) wp.onchange=()=>{S.write.p=+wp.value;S.write.checked=false;render();};
  const wt=$("#wt"); if(wt) wt.oninput=()=>{S.write.text=wt.value;S.write.checked=false;$("#cnt").innerHTML=counters(analyze(wt.value));$("#wres").hidden=true;};
  const wc=$("#wcheck"); if(wc) wc.onclick=()=>{ const a=analyze(S.write.text); if(a.words<20){toast("Escribe al menos 20 palabras");return;}
    S.write.checked=true; const box=$("#wres"); box.innerHTML=wres(a); box.hidden=false; if(!S.write.xp){S.write.xp=1;S.xp+=25;toast("+25 XP por tu primer ensayo");} box.scrollIntoView({behavior:"smooth",block:"start"}); };
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#cf"); c.hidden=false; const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#FF5C5C","#FFB423","#7B3FE4","#2F7BF5","#11A795","#F0468F"];
  const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*3,r:Math.random()*6,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*6)]}));
  let f=0; (function loop(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((f+p.r)/12);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*0.6);}); if(++f<130) requestAnimationFrame(loop); else c.hidden=true; })();
}
render();
</script>
