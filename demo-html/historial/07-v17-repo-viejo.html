<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.lg.me{background:rgba(79,70,229,.16);font-weight:700}.lg b{width:26px}.lg span{flex:1;overflow-wrap:anywhere}
.up{border-left:4px solid var(--ok)}.dn{border-left:4px solid var(--no)}.err{color:var(--no);font-weight:600}
.dif{display:flex;gap:8px}.dif button{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:10px 4px}.dif small{font-weight:500;font-size:12px}.dot{width:64px;height:64px;font-size:20px}.tm{height:6px;margin-bottom:4px}label{font-size:14px;font-weight:600;display:block}textarea{width:100%;padding:10px;border-radius:12px;border:2px solid var(--br);background:var(--cd);color:inherit;font:inherit}.hl{background:rgba(245,158,11,.35);border-radius:4px}#st{line-height:1.8}nav button{font-size:11px}.path{flex-direction:row;overflow-x:auto;position:relative;min-height:210px;align-items:center;padding:28px 8px;gap:2px;scroll-behavior:smooth}.node{transform:translateY(var(--x));flex:0 0 auto;margin:0 6px}:root[data-th=light]{--bg:#f6f7fb;--cd:#fff;--tx:#1f2430;--mu:#6b7280;--br:#e3e6ee;--ac:#4f46e5}:root[data-th=dark]{--bg:#12141b;--cd:#1c1f29;--tx:#eef0f6;--mu:#9aa1b2;--br:#2c3040;--ac:#818cf8}.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}nav button{padding:8px 2px;min-width:0;font-size:10.5px}@media(min-width:768px){nav button{padding:14px 4px;font-size:11px}}</style></head><body><div class="app" id="app"></div><div id="live" class="sr" aria-live="polite"></div><noscript>Activa JavaScript para usar el demo.</noscript>

,"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-04","examen":"Saber 11","area":"Matemáticas","competencia":"Argumentación","nivel":"Intermedio","enunciado":"Un grupo registró cuántos libros leyó cada integrante en un mes: 2, 3, 3, 4 y 8. ¿Cuál es la mediana?","opciones":[{"id":"A","texto":"2"},{"id":"B","texto":"3"},{"id":"C","texto":"4"},{"id":"D","texto":"8"}],"respuesta":"B","explicacion":"Los datos ya están ordenados y el valor central de los cinco es 3.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-01","examen":"Saber 11","area":"Lectura Crítica","competencia":"Comprensión local","nivel":"Básico","enunciado":"Lee: «El club escolar abrió los miércoles para que quienes no pueden asistir los viernes también tengan un espacio de lectura». Según el texto, ¿por qué abrió el miércoles?","opciones":[{"id":"A","texto":"Para reemplazar todos los clubes escolares."},{"id":"B","texto":"Para ofrecer otra oportunidad a quienes no pueden ir el viernes."},{"id":"C","texto":"Para preparar una competencia de lectura."},{"id":"D","texto":"Para reducir la cantidad de libros disponibles."}],"respuesta":"B","explicacion":"El texto indica que el nuevo horario busca incluir a quienes no pueden asistir el viernes.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-02","examen":"Saber 11","area":"Lectura Crítica","competencia":"Comprensión global","nivel":"Básico","enunciado":"Un aviso dice: «Trae tu propia botella; el punto de agua del parque estará habilitado durante toda la jornada». ¿Cuál es el propósito principal del aviso?","opciones":[{"id":"A","texto":"Invitar a las personas a usar el punto de agua llevando una botella."},{"id":"B","texto":"Informar que el parque estará cerrado."},{"id":"C","texto":"Pedir que se vendan botellas en el parque."},{"id":"D","texto":"Anunciar una competencia deportiva."}],"respuesta":"A","explicacion":"El aviso comunica que habrá agua disponible e invita a llevar una botella reutilizable.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-03","examen":"Saber 11","area":"Lectura Crítica","competencia":"Reflexión y evaluación","nivel":"Intermedio","enunciado":"Una columna afirma que los jardines del barrio reducen el calor y luego describe cómo tres calles con árboles tienen más sombra al mediodía. ¿Qué función cumple el ejemplo de las calles?","opciones":[{"id":"A","texto":"Presentar un caso que apoya la afirmación."},{"id":"B","texto":"Cambiar el tema hacia el transporte."},{"id":"C","texto":"Negar que los árboles produzcan sombra."},{"id":"D","texto":"Dar una instrucción para plantar árboles."}],"respuesta":"A","explicacion":"El caso de las calles ilustra la relación entre árboles y sombra que sostiene la columna.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"lec-04","examen":"Saber 11","area":"Lectura Crítica","competencia":"Comprensión local","nivel":"Básico","enunciado":"Lee: «Aunque el cielo estaba nublado, el equipo decidió iniciar la observación de aves y llevó impermeables por precaución». ¿Qué hizo el equipo?","opciones":[{"id":"A","texto":"Canceló la observación por completo."},{"id":"B","texto":"Comenzó la actividad y se preparó para la lluvia."},{"id":"C","texto":"Esperó a que el cielo estuviera despejado."},{"id":"D","texto":"Dejó los impermeables en casa."}],"respuesta":"B","explicacion":"El equipo inició la observación y llevó impermeables como medida preventiva.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-01","examen":"Saber 11","area":"Ciencias Naturales","competencia":"Indagación","nivel":"Básico","enunciado":"Un grupo quiere comparar cuánto tarda en derretirse un cubo de hielo sobre metal y sobre madera. ¿Qué condición debe mantener igual para que la comparación sea más justa?","opciones":[{"id":"A","texto":"El tamaño inicial de los cubos y el lugar de observación."},{"id":"B","texto":"El material de las dos superficies."},{"id":"C","texto":"El tiempo que tarda cada cubo en derretirse."},{"id":"D","texto":"El resultado que espera obtener el grupo."}],"respuesta":"A","explicacion":"Al mantener iguales el tamaño y el entorno, el material de la superficie es la diferencia principal.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-02","examen":"Saber 11","area":"Ciencias Naturales","competencia":"Uso comprensivo del conocimiento científico","nivel":"Básico","enunciado":"En un terrario cerrado, las plantas reciben luz y agua. ¿Qué proceso permite que produzcan azúcares usando energía luminosa?","opciones":[{"id":"A","texto":"La evaporación"},{"id":"B","texto":"La fotosíntesis"},{"id":"C","texto":"La condensación"},{"id":"D","texto":"La erosión"}],"respuesta":"B","explicacion":"En la fotosíntesis las plantas usan energía de la luz para producir azúcares a partir de agua y dióxido de carbono.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-03","examen":"Saber 11","area":"Ciencias Naturales","competencia":"Explicación de fenómenos","nivel":"Básico","enunciado":"Al poner una cuchara fría dentro de una bebida tibia, la cuchara se calienta y la bebida se enfría un poco. ¿Cómo se transfiere principalmente la energía entre ambos?","opciones":[{"id":"A","texto":"Del objeto más frío al más caliente de forma espontánea."},{"id":"B","texto":"De la bebida más caliente hacia la cuchara más fría."},{"id":"C","texto":"Solo por la producción de luz."},{"id":"D","texto":"No hay transferencia de energía."}],"respuesta":"B","explicacion":"La energía térmica fluye del cuerpo con mayor temperatura al de menor temperatura.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"cie-04","examen":"Saber 11","area":"Ciencias Naturales","competencia":"Indagación","nivel":"Intermedio","enunciado":"Para investigar si la cantidad de luz afecta el crecimiento de una planta, ¿qué dato sería más útil registrar cada semana?","opciones":[{"id":"A","texto":"La altura de cada planta y las horas de luz recibidas."},{"id":"B","texto":"El color favorito de quien cuida la planta."},{"id":"C","texto":"La marca del cuaderno donde se anotan los datos."},{"id":"D","texto":"La cantidad de macetas en otras casas."}],"respuesta":"A","explicacion":"La altura mide crecimiento y las horas de luz permiten comparar la condición que se estudia.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-01","examen":"Saber 11","area":"Sociales y Ciudadanas","competencia":"Pensamiento social","nivel":"Básico","enunciado":"En una comunidad, varias personas proponen usar el salón comunal para actividades distintas. ¿Qué mecanismo permite escuchar propuestas y acordar un uso compartido?","opciones":[{"id":"A","texto":"Una reunión abierta con turnos de palabra y votación."},{"id":"B","texto":"Cerrar el salón sin explicar el motivo."},{"id":"C","texto":"Permitir que decida quien llegue primero."},{"id":"D","texto":"Cancelar todas las actividades futuras."}],"respuesta":"A","explicacion":"La participación con deliberación y una regla acordada ayuda a tomar una decisión colectiva.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-02","examen":"Saber 11","area":"Sociales y Ciudadanas","competencia":"Interpretación y análisis de perspectivas","nivel":"Básico","enunciado":"Un mercado local cambia su horario. Las personas que venden piden abrir más temprano y parte del vecindario pide reducir el ruido de madrugada. ¿Qué acción reconoce ambas perspectivas?","opciones":[{"id":"A","texto":"Ignorar a quienes viven cerca."},{"id":"B","texto":"Probar un horario acordado y revisar sus efectos con ambos grupos."},{"id":"C","texto":"Prohibir permanentemente el mercado."},{"id":"D","texto":"Suponer que todos tienen la misma necesidad."}],"respuesta":"B","explicacion":"Un acuerdo revisable permite considerar tanto la actividad económica como el bienestar vecinal.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-03","examen":"Saber 11","area":"Sociales y Ciudadanas","competencia":"Pensamiento reflexivo y sistémico","nivel":"Intermedio","enunciado":"Una ciudad amplía una cicloruta para conectar dos barrios con una biblioteca. ¿Cuál podría ser un efecto que conviene evaluar además del tiempo de viaje?","opciones":[{"id":"A","texto":"Si más personas pueden llegar a servicios y espacios públicos."},{"id":"B","texto":"El nombre de la pintura usada en los mapas."},{"id":"C","texto":"La cantidad de letras en el nombre de los barrios."},{"id":"D","texto":"El color de las bicicletas privadas."}],"respuesta":"A","explicacion":"Una conexión puede influir en el acceso a servicios, además de modificar el tiempo de desplazamiento.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"soc-04","examen":"Saber 11","area":"Sociales y Ciudadanas","competencia":"Pensamiento social","nivel":"Básico","enunciado":"Un grupo vecinal quiere solicitar que se repare una luminaria pública. ¿Qué información hace más clara su solicitud a la entidad responsable?","opciones":[{"id":"A","texto":"La ubicación aproximada, el problema observado y la fecha."},{"id":"B","texto":"Una lista de rumores del barrio."},{"id":"C","texto":"Los datos personales de todas las familias."},{"id":"D","texto":"Una petición sin describir el asunto."}],"respuesta":"A","explicacion":"Ubicación, descripción y fecha ayudan a identificar el problema sin divulgar datos privados innecesarios.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"ing-01","examen":"Saber 11","area":"Inglés","competencia":"Comprensión de textos cortos","nivel":"Básico","enunciado":"Read the note: “The science room is closed today. Please meet your group in the library at 2 p.m.” Where should the group meet?","opciones":[{"id":"A","texto":"In the science room"},{"i e the exchange: “Would you like some water?” “Yes, ___.”","opciones":[{"id":"A","texto":"please"},{"id":"B","texto":"yesterday"},{"id":"C","texto":"there are"},{"id":"D","texto":"never mind"}],"respuesta":"A","explicacion":"“Yes, please” is a polite and natural way to accept an offer.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-b04","examen":"Saber 11","area":"Matemáticas","competencia":"Formulación y ejecución","nivel":"Básico","enunciado":"Una biblioteca organiza 3 estantes con 8 libros cada uno y presta 5 libros. ¿Cuántos quedan en esos estantes?","opciones":[{"id":"A","texto":"19"},{"id":"B","texto":"21"},{"id":"C","texto":"24"},{"id":"D","texto":"29"}],"respuesta":"A","explicacion":"Los estantes reúnen 3 × 8 = 24 libros; al prestar 5 quedan 24 − 5 = 19.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-b05","examen":"Saber 11","area":"Matemáticas","competencia":"Interpretación y representación","nivel":"Básico","enunciado":"Una receta usa 3 tazas de avena para preparar 4 porciones. Si se duplican las porciones manteniendo la receta, ¿cuántas tazas se necesitan?","opciones":[{"id":"A","texto":"5"},{"id":"B","texto":"6"},{"id":"C","texto":"7"},{"id":"D","texto":"8"}],"respuesta":"B","explicacion":"Duplicar de 4 a 8 porciones requiere duplicar también la avena: 3 × 2 = 6 tazas.","autor":"Equipo demo ficticio","revisores":["Pendiente de revisión (1)","Pendiente de revisión (2)"],"estado":"ejemplo-demo","original":true,"fuente":"Contenido original","marcaContenido":"Pregunta de práctica, no oficial"},{"id":"mat-i02","examen":"Saber 11","area":"Matemáticas","competencia":"Argumentación","nivel":"
