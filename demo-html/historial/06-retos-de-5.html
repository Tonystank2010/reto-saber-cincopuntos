.week{width:100%;height:auto;display:block}
/* email */
.mail{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:13.5px}
.mail .mh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.mail .mh b{color:var(--ink)}
.mail .mb{padding:14px;display:flex;flex-direction:column;gap:10px;line-height:1.55}
.mail .banner{border-radius:12px;padding:12px;color:#fff;background:linear-gradient(135deg,var(--grape),var(--sky));display:flex;align-items:center;gap:10px}
.mail .banner .five{color:#fff}.mail .banner .five i{color:var(--sun)}
.mail table{width:100%;border-collapse:collapse;font-size:13px}
.mail td,.mail th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.mail th{color:var(--muted);font-weight:700}
.mail td:last-child,.mail th:last-child{text-align:right}
/* plans */
.plan{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.plan.hot{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 6%,var(--card))}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan .ph b{font-family:var(--display);font-size:18px;font-weight:600}
.plan .pr{font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap}
.plan .pr small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.plan ul{margin:0;padding-left:18px;color:var(--muted);line-height:1.6;font-size:14px}
.prof{display:flex;align-items:center;gap:14px}
.prof svg{width:68px;height:68px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted);font-weight:700}
.kv span:nth-child(even){min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--app);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;max-width:min(90vw,380px);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13.5px}
.tag[aria-pressed=&quot;true&quot;]{background:var(--grape);border-color:var(--grape);color:#fff}
.tag.day{width:40px;height:40px;padding:0;display:grid;place-items:center}
.info svg.mascot{width:44px;height:44px;flex:none}
.moti{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px 14px;background:color-mix(in srgb,var(--mint) 16%,var(--card));border:1.5px solid color-mix(in srgb,var(--mint) 45%,transparent)}
.moti svg{width:48px;height:48px;flex:none}
.moti small{display:block;font-weight:800;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.moti b{font-size:15px;line-height:1.35}
.alertbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px}
.alertbar svg{width:22px;height:22px;color:var(--coral);flex:none}
.alertbar span{flex:1}
.alertbar button{border:0;background:none;color:var(--grape);font-weight:800}
.freeze{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--sky) 12%,var(--card));border-radius:16px;padding:10px 14px}
.freeze .ice{width:38px;height:38px;border-radius:12px;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.freeze small{color:var(--muted)}
.lock{border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,var(--grape),var(--sky) 60%,var(--mint))}
.notif{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.92);color:#1b1340;border-radius:16px;padding:10px 12px}
.notif svg{width:34px;height:34px;flex:none}
.notif small{display:block;color:#615a85;font-size:11.5px;font-weight:700}
.notif b{display:block;font-size:14px;line-height:1.3}
.notif span{font-size:13px;color:#3b3466}
.followbox{display:flex;flex-direction:column;gap:10px;border-radius:20px;padding:14px;background:color-mix(in srgb,var(--pink) 12%,var(--card));border:1.5px dashed var(--pink)}
.followbox &gt; small{color:var(--muted);margin-top:-6px}
.followbox .tag[aria-pressed=&quot;true&quot;]{background:var(--pink);border-color:var(--pink)}
.old{text-decoration:line-through;color:var(--muted);font-size:14px;font-family:var(--body);font-weight:700;margin-right:4px}
.req{display:flex;align-items:center;gap:10px}
.req svg.av{width:40px;height:40px;flex:none}
.req .nm{flex:1;min-width:0}.req .nm small{display:block;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--card);border:1.5px dashed var(--line);border-radius:20px;padding:16px;color:var(--muted);font-weight:700}
.empty svg.mascot{width:60px;height:60px}
.link{border:0;background:none;color:var(--grape);font-weight:800;text-decoration:underline}
.code{font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--grape)}
.pf{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.pf svg.av{width:44px;height:44px;flex:none}
.pf span{flex:1;min-width:0}.pf small{display:block;color:var(--muted);font-weight:700}
.pf .go{flex:none;font-size:26px;color:var(--coral);font-weight:800}
.pick-plan{text-align:left;width:100%;cursor:pointer}
.pick-plan[aria-pressed=&quot;true&quot;]{border-color:var(--grape);box-shadow:0 0 0 3px color-mix(in srgb,var(--grape) 30%,transparent)}
.chosen{background:color-mix(in srgb,var(--grape) 10%,var(--card));border-radius:14px;padding:10px 12px;font-size:14px}
.hearts{font-size:15px;color:var(--coral);letter-spacing:1px;white-space:nowrap}
.hearts i{font-style:normal;color:var(--muted)}
.paywall{border:1.5px solid var(--sun);background:color-mix(in srgb,var(--sun) 12%,var(--card))}
.paywall svg.mascot{width:56px;height:56px}
.cartcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:20px;padding:12px 14px;background:linear-gradient(135deg,var(--grape),var(--sky));color:#fff}
.cartcard .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px;flex:none}
.cartcard span{flex:1;min-width:0}.cartcard small{display:block;opacity:.9}.cartcard .go{flex:none;font-size:26px;font-weight:800}
.mod{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:18px;overflow:hidden}
.mod summary{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;list-style:none}
.mod summary::-webkit-details-marker{display:none}
.mod summary svg.art{width:44px;height:44px;flex:none;background:var(--c);border-radius:12px;padding:4px}
.mod summary small{display:block;color:var(--muted);font-weight:700}
.modbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.cart{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.cart.locked{opacity:.7}
.cart .tip{color:var(--muted);font-size:13px}
.ctys{display:flex;flex-direction:column;gap:8px}
.cty{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.cty.on{border-color:var(--grape);box-shadow:0 0 0 3px color-mix(in srgb,var(--grape) 25%,transparent)}
.cty .fl{font-size:28px;flex:none}.cty span{flex:1;min-width:0}.cty small{display:block;color:var(--muted);font-weight:700}
.cty .go{flex:none;font-size:24px;color:var(--coral);font-weight:800}
.ctychip{align-self:center;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.selfrow{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:10px 12px}
.selfrow .tag[aria-pressed=&quot;true&quot;]{background:var(--c);border-color:var(--c)}
.lvlbadge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.lvlbadge.l1{background:var(--mint)}.lvlbadge.l2{background:var(--sky)}.lvlbadge.l3{background:var(--grape)}
.lvlbar{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:13.5px}
.lvmsg{background:color-mix(in srgb,var(--sky) 14%,transparent);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none}
.step span{flex:1;min-width:0}.step small{display:block;color:var(--muted);font-weight:600}
.step .go{flex:none;font-size:22px;font-weight:800;color:var(--coral)}
.step.ok{border-color:var(--good)}.step.ok .n{background:var(--good)}
.step.off{opacity:.6}.step.off .n{background:var(--muted)}
.flip{perspective:1200px;min-height:340px;cursor:pointer}
.flip .inner{position:relative;width:100%;min-height:340px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:2px solid var(--c);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.face .ck{font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.face h2{font-size:22px}
.face .tip{color:var(--muted);font-size:13.5px}
.face .opts .opt{padding:9px 12px}
.opt.gone{opacity:.25}
@media (prefers-reduced-motion:reduce){.flip .inner{transition:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:460px){.stage{padding-block:0;padding-left:0;padding-right:0}.phone{border-radius:0;border:0;min-height:100%;max-width:none}
  .screen,.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

 function draw(){const w=cv.width=innerWidth,h=cv.height=innerHeight;let seed=7;const r=()=&gt;(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i&lt;Math.round(w*h/9000);i++){cx.save();cx.globalAlpha=.22;cx.fillStyle=cols[i%6];cx.translate(r()*w,r()*h);cx.rotate(r()*6.28);
   if(i%3===0){cx.beginPath();cx.arc(0,0,3+r()*3,0,6.28);cx.fill();}else if(i%3===1){cx.fillRect(-6,-2,12,4);}else{cx.beginPath();cx.moveTo(0,-5);cx.lineTo(5,4);cx.lineTo(-5,4);cx.fill();}cx.restore();}}
 draw();addEventListener(&quot;resize&quot;,draw);})();

  document.querySelectorAll(&quot;#tabs button&quot;).forEach(b=&gt;{if(b.dataset.tab===tabOf)b.setAttribute(&quot;aria-current&quot;,&quot;page&quot;);else b.removeAttribute(&quot;aria-current&quot;);});
  header(); (SCREENS[v])(); scr.scrollTop=0; }

function ranking(limit){

  const me={n:(S.user?.name.split(&quot; &quot;)[0]||&quot;Tú&quot;)+&quot; (tú)&quot;,c:&quot;Racha &quot;+S.streak,xp:S.xp,av:S.user?.avatar||0,me:true};
  const pub=[...ok.filter(f=&gt;!f.priv),me].sort((x,y)=&gt;y.xp-x.xp), hid=ok.filter(f=&gt;f.priv);

  const priv=limit?&quot;&quot;:hid.map(p=&gt;`&lt;div class=&quot;rrow&quot;&gt;&lt;span class=&quot;pos&quot;&gt;🔒&lt;/span&gt;${avatar(p.av)}&lt;span class=&quot;nm&quot;&gt;${esc(p.n)}&lt;small&gt;Prefiere no mostrar su progreso&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;xp&quot;&gt;—&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;);
  return `&lt;div class=&quot;rank&quot;&gt;${rows}${priv}&lt;/div&gt;`; }

/* ---------- repaso (flashcards) ---------- */
function startRepaso(k){ const L1=lvl(k);
  const concepts=MODULOS[k].temas.map(t=&gt;({type:&quot;c&quot;,t:t.t,x:t.x,tip:t.tip}));
  const pool=shuffle(Q[k].filter(q=&gt;q.d&lt;=Math.max(1,L1))).slice(0,3);
  const more=pool.length&lt;3?shuffle(Q[k].filter(q=&gt;!pool.includes(q))).slice(0,3-pool.length):[];
  const practice=[...pool,...more].map(q=&gt;({type:&quot;q&quot;,q}));
  RP={k,cards:[...concepts,...practice],i:0,flip:false,ok:0,tried:0,answered:false}; go(&quot;repaso&quot;); }
function cardView(){ const r=RP,k=r.k,a=AREAS[k],c=r.cards[r.i],last=r.i===r.cards.length-1;
  const dots=r.cards.map((x,j)=&gt;`&lt;span class=&quot;${j&lt;r.i?&quot;ok&quot;:j===r.i?&quot;cur&quot;:&quot;&quot;}&quot;&gt;&lt;/span&gt;`).join(&quot;&quot;);
  let front=&quot;&quot;,back=&quot;&quot;;
  if(c.type===&quot;c&quot;){ front=`&lt;small class=&quot;ck&quot;&gt;Tarjeta de estudio&lt;/small&gt;&lt;h2&gt;${c.t}&lt;/h2&gt;&lt;p class=&quot;note&quot;&gt;Toca la tarjeta para ver la explicación&lt;/p&gt;`;
    back=`&lt;small class=&quot;ck&quot;&gt;Explicación&lt;/small&gt;&lt;p&gt;${c.x}&lt;/p&gt;&lt;p class=&quot;tip&quot;&gt;💡 ${c.tip}&lt;/p&gt;`; }
  else { const q=c.q; front=`&lt;small class=&quot;ck&quot;&gt;Practica · sin perder vidas&lt;/small&gt;${q.ctx?`&lt;div class=&quot;ctx&quot; style=&quot;--c:${a.c}&quot;&gt;${q.ctx}&lt;/div&gt;`:&quot;&quot;}&lt;p class=&quot;qtext&quot;&gt;${q.q}&lt;/p&gt;
     &lt;div class=&quot;opts&quot;&gt;${q.o.map((o,j)=&gt;`&lt;button class=&quot;opt&quot; data-ro=&quot;${j}&quot;&gt;&lt;span class=&quot;bub&quot;&gt;${L[j]}&lt;/span&gt;&lt;span&gt;${o}&lt;/span&gt;&lt;/button&gt;`).join(&quot;&quot;)}&lt;/div&gt;&lt;div id=&quot;rfb&quot;&gt;&lt;/div&gt;`;
    back=`&lt;small class=&quot;ck&quot;&gt;La respuesta correcta era la ${L[q.a]}&lt;/small&gt;&lt;p class=&quot;qtext&quot;&gt;${q.o[q.a]}&lt;/p&gt;&lt;p&gt;&lt;b&gt;¿Por qué?&lt;/b&gt; ${q.e}&lt;/p&gt;&lt;p class=&quot;tip&quot;&gt;Equivocarte en el repaso no quita vidas: así aprendes antes de la evaluación.&lt;/p&gt;`; }
  scr.innerHTML=`&lt;div class=&quot;qhead&quot;&gt;&lt;button class=&quot;x&quot; data-go=&quot;prep&quot; aria-label=&quot;Salir&quot;&gt;×&lt;/button&gt;&lt;div class=&quot;prog&quot;&gt;${dots}&lt;/div&gt;&lt;span class=&quot;pill&quot; style=&quot;--c:${a.c}&quot;&gt;Repaso&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;flip${r.flip?&quot; on&quot;:&quot;&quot;}&quot; id=&quot;fc&quot; style=&quot;--c:${a.c}&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;div class=&quot;face front&quot;&gt;${front}&lt;/div&gt;&lt;div class=&quot;face back&quot;&gt;${back}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;row&quot; id=&quot;rnav&quot;&gt;${c.type===&quot;c&quot;?`&lt;button class=&quot;btn ghost&quot; id=&quot;rf&quot;&gt;${r.flip?&quot;Ver tarjeta&quot;:&quot;Voltear&quot;}&lt;/button&gt;`:&quot;&quot;}&lt;button class=&quot;btn&quot; id=&quot;rn&quot; ${c.type===&quot;q&quot;&amp;&amp;!r.answered?&quot;disabled&quot;:&quot;&quot;}&gt;${last?&quot;Terminar repaso&quot;:&quot;Siguiente&quot;}&lt;/button&gt;&lt;/div&gt;`;
  const fc=$(&quot;#fc&quot;);
  if(c.type===&quot;c&quot;){ fc.onclick=()=&gt;{r.flip=!r.flip;cardView();}; $(&quot;#rf&quot;).onclick=()=&gt;{r.flip=!r.flip;cardView();}; r.answered=true; }
  else if(!r.answered){ scr.querySelectorAll(&quot;[data-ro]&quot;).forEach(b=&gt;b.onclick=e=&gt;{e.stopPropagation(); const j=+b.dataset.ro,q=c.q; r.answered=true; r.tried++;
      scr.querySelectorAll(&quot;[data-ro]&quot;).forEach((x,n)=&gt;{x.disabled=true;if(n===q.a)x.classList.add(&quot;right&quot;);else if(n===j)x.classList.add(&quot;wrong&quot;);});
      if(j===q.a){r.ok++;beep(true);$(&quot;#rfb&quot;).innerHTML=`&lt;div class=&quot;fb ok&quot;&gt;${star()}&lt;div&gt;&lt;b&gt;¡Correcto!&lt;/b&gt;${q.e}&lt;/div&gt;&lt;/div&gt;`;$(&quot;#rn&quot;).disabled=false;}
      else{beep(false);setTimeout(()=&gt;{r.flip=true;cardView();},650);} }); }
  $(&quot;#rn&quot;).onclick=()=&gt;{ if(last){ S.rep=S.rep||{}; S.rep[k]=today(); save(); repasoDone(); return; } r.i++; r.flip=false; r.answered=false; cardView(); };
}

/* ---------- quiz engine ---------- */
function shuffle(a){return a.map(v=&gt;[Math.random(),v]).sort((x,y)=&gt;x[0]-y[0]).map(x=&gt;x[1]);}
function pickQ(k,d,used){ const c=Q[k].filter(q=&gt;!used.includes(q)); const ex=c.filter(q=&gt;q.d===d); const pool=ex.length?ex:c.sort((x,y)=&gt;Math.abs(x.d-d)-Math.abs(y.d-d)); return shuffle(pool.slice(0,ex.length||2))[0]; }

  else { const L1=lvl(k); const pool=shuffle(Q[k]).sort((x,y)=&gt;Math.abs(x.d-L1)-Math.abs(y.d-L1)); list=shuffle(pool.slice(0,5)).map(q=&gt;({...q,k})); secs=ADJ[L1].secs; hints=ADJ[L1].hints; }

   &lt;div class=&quot;qtag&quot;&gt;&lt;span class=&quot;pill&quot; style=&quot;--c:${a.c}&quot;&gt;${z.mode===&quot;diag&quot;?&quot;Diagnóstico · &quot;:&quot;&quot;}${a.name}&lt;/span&gt;&lt;span class=&quot;clock&quot; id=&quot;secs&quot;&gt;${left} s&lt;/span&gt;&lt;/div&gt;${z.mode===&quot;diag&quot;?`&lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Dificultad: ${[&quot;&quot;,&quot;fácil&quot;,&quot;media&quot;,&quot;difícil&quot;][it.d]}&lt;/p&gt;`:(z.hints?`&lt;button class=&quot;link&quot; id=&quot;hint&quot;&gt;💡 Pista: quitar 2 opciones (te quedan ${z.hints})&lt;/button&gt;`:&quot;&quot;)}

function answer(j,left){ const z=quiz; if(!z||z.locked)return; z.locked=true; clearInterval(tick);

  if(z.mode!==&quot;diag&quot;&amp;&amp;!isPaid()){ header();
    scr.innerHTML=`&lt;div class=&quot;score&quot;&gt;${star(outOfLives?&quot;sad&quot;:&quot;wow&quot;)}&lt;h3 style=&quot;color:${AREAS[z.k].c}&quot;&gt;${AREAS[z.k].name}&lt;/h3&gt;&lt;div class=&quot;big&quot;&gt;${n}&lt;small&gt;/${t}&lt;/small&gt;&lt;/div&gt;&lt;b&gt;${outOfLives?&quot;¡Te quedaste sin vidas!&quot;:&quot;¡Reto terminado!&quot;}&lt;/b&gt;

const Q = [
 {m:&quot;lc&quot;, ctx:&quot;«Las empresas que adoptaron el trabajo remoto reportan menos ausentismo. Sin embargo, varios estudios advierten que la frontera entre la vida laboral y la personal se diluye, y que el costo de esa mezcla lo pagan sobre todo quienes cuidan a otros en casa.»&quot;,

function shuffle(a){ a=[...a]; for(let i=a.length-1;i&gt;0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function daily(){ const mods=[&quot;lc&quot;,&quot;rc&quot;,&quot;cc&quot;,&quot;en&quot;]; const pick=shuffle(mods).concat([mods[Math.floor(Math.random()*4)]]).map(m=&gt;shuffle(Q.filter(q=&gt;q.m===m))[0]);
  const uniq=[...new Set(pick)]; while(uniq.length&lt;5){ const q=shuffle(Q)[0]; if(!uniq.includes(q)&amp;&amp;q.m!==&quot;ce&quot;) uniq.push(q);} startQuiz(uniq,&quot;Reto del día&quot;); }

const CONNECT = [&quot;además&quot;,&quot;sin embargo&quot;,&quot;por lo tanto&quot;,&quot;por consiguiente&quot;,&quot;en cambio&quot;,&quot;no obstante&quot;,&quot;por otra parte&quot;,&quot;así mismo&quot;,&quot;asimismo&quot;,&quot;en primer lugar&quot;,&quot;en segundo lugar&quot;,&quot;finalmente&quot;,&quot;por ejemplo&quot;,&quot;en conclusión&quot;,&quot;en síntesis&quot;,&quot;es decir&quot;,&quot;porque&quot;,&quot;debido a&quot;,&quot;aunque&quot;,&quot;por esta razón&quot;,&quot;de modo que&quot;,&quot;en consecuencia&quot;];
const STANCE = [&quot;considero&quot;,&quot;creo que&quot;,&quot;en mi opinión&quot;,&quot;estoy de acuerdo&quot;,&quot;no estoy de acuerdo&quot;,&quot;pienso que&quot;,&quot;defiendo&quot;,&quot;mi postura&quot;,&quot;es necesario&quot;,&quot;no debería&quot;,&quot;debería&quot;];
const CLOSE = [&quot;en conclusión&quot;,&quot;en síntesis&quot;,&quot;para concluir&quot;,&quot;finalmente&quot;,&quot;en resumen&quot;,&quot;por todo lo anterior&quot;];
function analyze(t){
  const low=t.toLowerCase();
  const words=(t.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]+/g)||[]).length;
  const paras=t.split(/\n\s*\n|\n/).filter(p=&gt;p.trim().split(/\s+/).length&gt;=8).length;
  const con=CONNECT.filter(c=&gt;low.includes(c));
  const stance=STANCE.some(s=&gt;low.includes(s));
  const close=CLOSE.some(s=&gt;low.includes(s));
  const sentences=(t.match(/[^.!?]+[.!?]/g)||[]);
  const longS=sentences.filter(s=&gt;s.split(/\s+/).length&gt;45).length;
  const ex=/por ejemplo|como es el caso|según|de acuerdo con|\d/.test(low);
  const plan=Math.min(100,(stance?55:15)+(ex?25:0)+(words&gt;=150?20:words&gt;=80?10:0));
  const org=Math.min(100,(paras&gt;=3?45:paras*15)+Math.min(40,con.length*8)+(close?15:0));
  const forma=Math.max(0,Math.min(100,(words&gt;=100?60:words*0.6)+(longS?0:25)+(/[A-ZÁÉÍÓÚÑ]/.test(t.trim()[0]||&quot;&quot;)?15:0)));
  const tips=[];
  if(!stance) tips.push(&quot;Di tu postura desde el inicio: «Considero que…», «No estoy de acuerdo con…».&quot;);
  if(!ex) tips.push(&quot;Apoya tu idea con un ejemplo, un dato o un caso.&quot;);
  if(paras&lt;3) tips.push(&quot;Organiza en 3 párrafos: postura, argumentos y conclusión.&quot;);
  if(con.length&lt;3) tips.push(&quot;Usa conectores para unir ideas: «además», «sin embargo», «por lo tanto».&quot;);
  if(!close) tips.push(&quot;Cierra con una conclusión: «En conclusión…».&quot;);
  if(longS) tips.push(&quot;Hay oraciones muy largas. Divídelas para que se lean mejor.&quot;);
  if(words&lt;150) tips.push(&quot;Apunta a unas 150 a 250 palabras.&quot;);
  if(!tips.length) tips.push(&quot;¡Muy buen texto! Revisa ortografía y tildes antes de entregar.&quot;);
  return {words,paras,con:con.length,plan,org,forma,total:Math.round((plan+org+forma)/3),tips};
}

function wres(a){ const r=(n,v)=&gt;`&lt;span&gt;${n}&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;i style=&quot;width:${v}%&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;b&gt;${v}&lt;/b&gt;`;

function ruta(){

  return `${header()}

  &lt;div class=&quot;timer&quot; style=&quot;height:10px&quot;&gt;&lt;i style=&quot;width:${pct}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;path&quot;&gt;${LEVELS.map((l,k)=&gt;`&lt;div class=&quot;stop ${k&lt;li?&quot;on&quot;:k===li?&quot;now&quot;:&quot;&quot;}&quot;&gt;&lt;span class=&quot;node&quot;&gt;${k+1}&lt;/span&gt;&lt;div&gt;&lt;b&gt;${l.n}&lt;/b&gt;&lt;p class=&quot;muted&quot;&gt;${l.d} · ${l.xp} XP&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;&lt;/div&gt;

  &lt;button class=&quot;btn wide&quot; id=&quot;again&quot;&gt;Otro reto&lt;/button&gt;&lt;button class=&quot;btn ghost wide&quot; data-go=&quot;home&quot;&gt;Volver al inicio&lt;/button&gt;&lt;/div&gt;`;
}

const CONNECT = [&quot;además&quot;,&quot;sin embargo&quot;,&quot;por lo tanto&quot;,&quot;por consiguiente&quot;,&quot;en cambio&quot;,&quot;no obstante&quot;,&quot;por otra parte&quot;,&quot;así mismo&quot;,&quot;asimismo&quot;,&quot;en primer lugar&quot;,&quot;en segundo lugar&quot;,&quot;finalmente&quot;,&quot;por ejemplo&quot;,&quot;en conclusión&quot;,&quot;en síntesis&quot;,&quot;es decir&quot;,&quot;porque&quot;,&quot;debido a&quot;,&quot;aunque&quot;,&quot;por esta razón&quot;,&quot;de modo que&quot;,&quot;en consecuencia&quot;];
const STANCE = [&quot;considero&quot;,&quot;creo que&quot;,&quot;en mi opinión&quot;,&quot;estoy de acuerdo&quot;,&quot;no estoy de acuerdo&quot;,&quot;pienso que&quot;,&quot;defiendo&quot;,&quot;mi postura&quot;,&quot;es necesario&quot;,&quot;no debería&quot;,&quot;debería&quot;];
const CLOSE = [&quot;en conclusión&quot;,&quot;en síntesis&quot;,&quot;para concluir&quot;,&quot;finalmente&quot;,&quot;en resumen&quot;,&quot;por todo lo anterior&quot;];
function analyze(t){
  const low=t.toLowerCase();
  const words=(t.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]+/g)||[]).length;
  const paras=t.split(/\n\s*\n|\n/).filter(p=&gt;p.trim().split(/\s+/).length&gt;=8).length;
  const con=CONNECT.filter(c=&gt;low.includes(c));
  const stance=STANCE.some(s=&gt;low.includes(s));
  const close=CLOSE.some(s=&gt;low.includes(s));
  const sentences=(t.match(/[^.!?]+[.!?]/g)||[]);
  const longS=sentences.filter(s=&gt;s.split(/\s+/).length&gt;45).length;
  const ex=/por ejemplo|como es el caso|según|de acuerdo con|\d/.test(low);
  const plan=Math.min(100,(stance?55:15)+(ex?25:0)+(words&gt;=150?20:words&gt;=80?10:0));
  const org=Math.min(100,(paras&gt;=3?45:paras*15)+Math.min(40,con.length*8)+(close?15:0));
  const forma=Math.max(0,Math.min(100,(words&gt;=100?60:words*0.6)+(longS?0:25)+(/[A-ZÁÉÍÓÚÑ]/.test(t.trim()[0]||&quot;&quot;)?15:0)));
  const tips=[];
  if(!stance) tips.push(&quot;Di tu postura desde el inicio: «Considero que…», «No estoy de acuerdo con…».&quot;);
  if(!ex) tips.push(&quot;Apoya tu idea con un ejemplo, un dato o un caso.&quot;);
  if(paras&lt;3) tips.push(&quot;Organiza en 3 párrafos: postura, argumentos y conclusión.&quot;);
  if(con.length&lt;3) tips.push(&quot;Usa conectores para unir ideas: «además», «sin embargo», «por lo tanto».&quot;);
  if(!close) tips.push(&quot;Cierra con una conclusión: «En conclusión…».&quot;);
  if(longS) tips.push(&quot;Hay oraciones muy largas. Divídelas para que se lean mejor.&quot;);
  if(words&lt;150) tips.push(&quot;Apunta a unas 150 a 250 palabras.&quot;);
  if(!tips.length) tips.push(&quot;¡Muy buen texto! Revisa ortografía y tildes antes de entregar.&quot;);
  return {words,paras,con:con.length,plan,org,forma,total:Math.round((plan+org+forma)/3),tips};
}
function write(){
  const w=S.write; const a=analyze(w.text);
  return `${header()}
  &lt;div class=&quot;card&quot; style=&quot;--c:var(--ce)&quot;&gt;&lt;span class=&quot;mtag&quot;&gt;Comunicación Escrita&lt;/span&gt;
    &lt;h3&gt;Taller del ensayo&lt;/h3&gt;
    &lt;label class=&quot;muted&quot; for=&quot;wp&quot;&gt;Escoge el tema&lt;/label&gt;
    &lt;select id=&quot;wp&quot;&gt;${PROMPTS.map((p,k)=&gt;`&lt;option value=&quot;${k}&quot; ${k===w.p?&quot;selected&quot;:&quot;&quot;}&gt;${esc(p)}&lt;/option&gt;`).join(&quot;&quot;)}&lt;/select&gt;
    &lt;div class=&quot;ctx&quot;&gt;${esc(PROMPTS[w.p])}&lt;/div&gt;
    &lt;label class=&quot;muted&quot; for=&quot;wt&quot;&gt;Tu texto&lt;/label&gt;
    &lt;textarea id=&quot;wt&quot; placeholder=&quot;Considero que… En primer lugar… Además… En conclusión…&quot;&gt;${esc(w.text)}&lt;/textarea&gt;
    &lt;div class=&quot;counters&quot; id=&quot;cnt&quot;&gt;${counters(a)}&lt;/div&gt;
    &lt;button class=&quot;btn wide&quot; id=&quot;wcheck&quot;&gt;Revisar mi texto&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot; id=&quot;wres&quot; ${w.checked?&quot;&quot;:&quot;hidden&quot;}&gt;${w.checked?wres(a):&quot;&quot;}&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Revisión automática de práctica. Da pistas de estructura; no reemplaza la calificación del Icfes.&lt;/p&gt;`;
}
function counters(a){ return `&lt;div&gt;&lt;b&gt;${a.words}&lt;/b&gt;&lt;small&gt;palabras&lt;/small&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;${a.paras}&lt;/b&gt;&lt;small&gt;párrafos&lt;/small&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;${a.con}&lt;/b&gt;&lt;small&gt;conectores&lt;/small&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;${a.total}&lt;/b&gt;&lt;small&gt;puntaje&lt;/small&gt;&lt;/div&gt;`; }
function wres(a){ const r=(n,v)=&gt;`&lt;span&gt;${n}&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;i style=&quot;width:${v}%&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;b&gt;${v}&lt;/b&gt;`;
  return `&lt;h3&gt;Tu revisión: ${a.total}/100&lt;/h3&gt;&lt;div class=&quot;rub&quot;&gt;${r(&quot;Planteamiento&quot;,Math.round(a.plan))}${r(&quot;Organización&quot;,Math.round(a.org))}${r(&quot;Forma&quot;,Math.round(a.forma))}&lt;/div&gt;&lt;ul class=&quot;tips&quot;&gt;${a.tips.map(t=&gt;`&lt;li&gt;${esc(t)}&lt;/li&gt;`).join(&quot;&quot;)}&lt;/ul&gt;`; }

function ruta(){
  const li=level(); const nx=LEVELS[li+1]; const pct=nx?Math.round((S.xp-LEVELS[li].xp)/(nx.xp-LEVELS[li].xp)*100):100;
  return `${header()}
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Tu ruta al grado&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;${nx?`Te faltan &lt;b&gt;${nx.xp-S.xp} XP&lt;/b&gt; para &lt;b&gt;${nx.n}&lt;/b&gt;.`:&quot;¡Llegaste a la cima!&quot;}&lt;/p&gt;
  &lt;div class=&quot;timer&quot; style=&quot;height:10px&quot;&gt;&lt;i style=&quot;width:${pct}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;path&quot;&gt;${LEVELS.map((l,k)=&gt;`&lt;div class=&quot;stop ${k&lt;li?&quot;on&quot;:k===li?&quot;now&quot;:&quot;&quot;}&quot;&gt;&lt;span class=&quot;node&quot;&gt;${k+1}&lt;/span&gt;&lt;div&gt;&lt;b&gt;${l.n}&lt;/b&gt;&lt;p class=&quot;muted&quot;&gt;${l.d} · ${l.xp} XP&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Diagnóstico por módulo&lt;/h3&gt;
  ${Object.keys(MOD).map(k=&gt;`&lt;div class=&quot;rub&quot; style=&quot;grid-template-columns:150px 1fr 34px&quot;&gt;&lt;span&gt;${MOD[k].n}&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;i style=&quot;width:${S.prog[k]}%;background:${MOD[k].c}&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;b&gt;${S.prog[k]}&lt;/b&gt;&lt;/div&gt;`).join(&quot;&quot;)}
  &lt;p class=&quot;muted&quot;&gt;Sube con cada respuesta correcta. Lo más débil se vuelve tu reto del día.&lt;/p&gt;&lt;/div&gt;`;
}
function plans(){
  return `${header()}
  &lt;div class=&quot;sec-h&quot;&gt;&lt;h2&gt;Planes Reto Pro&lt;/h2&gt;&lt;span&gt;Precios de ejemplo&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;plan&quot;&gt;&lt;b&gt;Gratis&lt;/b&gt;&lt;span class=&quot;price&quot;&gt;$0&lt;/span&gt;&lt;ul&gt;&lt;li&gt;Reto del día con 3 vidas&lt;/li&gt;&lt;li&gt;Diagnóstico inicial&lt;/li&gt;&lt;li&gt;Sin guardar progreso&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;plan hot&quot;&gt;&lt;span class=&quot;ribbon&quot;&gt;Más elegido&lt;/span&gt;&lt;b&gt;Plan Pro semestral&lt;/b&gt;&lt;span class=&quot;price&quot;&gt;$29.900&lt;/span&gt;&lt;ul&gt;&lt;li&gt;Retos ilimitados en los 5 módulos genéricos&lt;/li&gt;&lt;li&gt;Taller de escritura con revisión&lt;/li&gt;&lt;li&gt;Simulacro completo con tiempo real&lt;/li&gt;&lt;li&gt;Ranking con tu universidad&lt;/li&gt;&lt;/ul&gt;&lt;button class=&quot;btn wide&quot; id=&quot;buy&quot;&gt;Quiero el plan&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;plan&quot;&gt;&lt;b&gt;Plan Universidad&lt;/b&gt;&lt;span class=&quot;price&quot;&gt;Convenio&lt;/span&gt;&lt;ul&gt;&lt;li&gt;Licencias para todo un programa académico&lt;/li&gt;&lt;li&gt;Informe por cohorte para la dirección del programa&lt;/li&gt;&lt;li&gt;Módulos específicos de la carrera&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Los precios son ilustrativos. Prueben valores en la hoja SIMULADOR del Excel de 5. antes de decidir.&lt;/p&gt;`;
}

function render(){
  const app=$(&quot;#app&quot;);
  app.innerHTML = S.view===&quot;home&quot;?home():S.view===&quot;quiz&quot;?quiz():S.view===&quot;result&quot;?result():S.view===&quot;write&quot;?write():S.view===&quot;ruta&quot;?ruta():plans();
  tabs(); bind();
  if(S.view===&quot;quiz&quot;&amp;&amp;S.quiz&amp;&amp;S.quiz.picked===null) runTimer();
}
function bind(){
  document.querySelectorAll(&quot;[data-go]&quot;).forEach(b=&gt;b.onclick=()=&gt;go(b.dataset.go));
  document.querySelectorAll(&quot;[data-exam]&quot;).forEach(b=&gt;b.onclick=()=&gt;{S.exam=b.dataset.exam;render();toast(S.exam===&quot;pro&quot;?&quot;Modo Saber Pro&quot;:&quot;Modo Saber TyT&quot;);});
  document.querySelectorAll(&quot;[data-mod]&quot;).forEach(b=&gt;b.onclick=()=&gt;startQuiz(shuffle(Q.filter(q=&gt;q.m===b.dataset.mod)),MOD[b.dataset.mod].n));
  document.querySelectorAll(&quot;[data-o]&quot;).forEach(b=&gt;b.onclick=()=&gt;answer(+b.dataset.o));
  const d=$(&quot;#daily&quot;); if(d) d.onclick=daily;
  const n=$(&quot;#next&quot;); if(n) n.onclick=next;
  const ag=$(&quot;#again&quot;); if(ag) ag.onclick=daily;
  const by=$(&quot;#buy&quot;); if(by) by.onclick=()=&gt;toast(&quot;En la beta no hay pagos reales&quot;);
  const wp=$(&quot;#wp&quot;); if(wp) wp.onchange=()=&gt;{S.write.p=+wp.value;S.write.checked=false;render();};
  const wt=$(&quot;#wt&quot;); if(wt) wt.oninput=()=&gt;{S.write.text=wt.value;S.write.checked=false;$(&quot;#cnt&quot;).innerHTML=counters(analyze(wt.value));$(&quot;#wres&quot;).hidden=true;};
  const wc=$(&quot;#wcheck&quot;); if(wc) wc.onclick=()=&gt;{ const a=analyze(S.write.text); if(a.words&lt;20){toast(&quot;Escribe al menos 20 palabras&quot;);return;}
    S.write.checked=true; const box=$(&quot;#wres&quot;); box.innerHTML=wres(a); box.hidden=false; if(!S.write.xp){S.write.xp=1;S.xp+=25;toast(&quot;+25 XP por tu primer ensayo&quot;);} box.scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;start&quot;}); };
}
function confetti(){
  if(matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches) return;
  const c=$(&quot;#cf&quot;); c.hidden=false; const x=c.getContext(&quot;2d&quot;); c.width=innerWidth; c.height=innerHeight;
  const cols=[&quot;#FF5C5C&quot;,&quot;#FFB423&quot;,&quot;#7B3FE4&quot;,&quot;#2F7BF5&quot;,&quot;#11A795&quot;,&quot;#F0468F&quot;];
  const P=Array.from({length:90},()=&gt;({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*3,r:Math.random()*6,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*6)]}));
  let f=0; (function loop(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=&gt;{p.y+=p.v;p.x+=Math.sin((f+p.r)/12);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*0.6);}); if(++f&lt;130) requestAnimationFrame(loop); else c.hidden=true; })();
}
render();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
</section>

<script>
function show(x){
  const menu = x==="menu";
  document.getElementById("pick").hidden = !menu;
  document.getElementById("run").hidden = menu;
  ["s11","pro","tyt"].forEach(k=>{ document.getElementById("f-"+k).hidden = k!==x; });
  document.querySelectorAll(".tabs [data-x]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.x===x));
  document.documentElement.style.height = "100%";
}
document.querySelectorAll("[data-x]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.x)));
</script>
